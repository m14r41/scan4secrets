name: Docs deploy

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Docusaurus showLastUpdateTime needs full history

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate sample reports from fixture
        # Runs scan4secrets against examples/sample-app so /docs/sample-report
        # always ships fresh reports matching the current code. Generated into
        # website/static/reports/ (git-ignored) — never committed.
        run: |
          python -m pip install --quiet .
          bash examples/generate-sample-reports.sh

      - name: Install dependencies
        working-directory: website
        run: bun install --frozen-lockfile || bun install

      - name: Build site
        working-directory: website
        env:
          NODE_ENV: production
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
