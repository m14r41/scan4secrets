    <c:out value="${param.name}"/>
  technical_impact: Attacker HTML/JS reflected into the page and executed in the victim browser.
  business_impact: Session theft, account takeover, and defacement of authenticated pages.

- id: jsp-xss-el-param-reflected
  category: vuln
