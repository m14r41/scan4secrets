  technical_impact: Arbitrary OS command execution as the servlet-container user.
  business_impact: Full application-server compromise and source/secret exfiltration.

- id: kotlin-command-injection-exec
  category: vuln
  name: Kotlin OS Command Injection
  description: Request/intent input reaches Runtime.exec or ProcessBuilder, often via string interpolation.
  severity: critical
