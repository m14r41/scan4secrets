    - 'only:'
    - 'if:'
    - 'unless:'
  cwe: CWE-352
  owasp: A01:2021 Broken Access Control
  remediation: Keep protect_from_forgery enabled; scope any exemption narrowly to token-authenticated APIs.
  secure_code: |
    protect_from_forgery with: :exception
  technical_impact: Cross-site requests mutate state using the victim's session cookie.
  business_impact: Account and data manipulation via forged requests, leading to takeover.

- id: web-csrf-spring-disabled
  category: vuln
  name: CSRF protection disabled in Spring Security
  description: Spring Security configuration calls csrf().disable(), removing CSRF token checks.
  severity: medium
  languages:
  - java
  keywords:
  - csrf
  - disable
  regex: \.csrf\s*\([^)]*\)\s*\.disable\s*\(|csrf\s*\([^)]*(?:\.disable|AbstractHttpConfigurer::disable)
  allowlist:
    regex:
    - CookieCsrfTokenRepository
    - stateless
    - JWT
  cwe: CWE-352
  owasp: A01:2021 Broken Access Control
  remediation: Leave CSRF enabled for cookie-session apps; only disable for stateless token APIs.
  secure_code: |
    http.csrf(csrf -> csrf.csrfTokenRepository(CookieCsrfTokenRepository.withHttpOnlyFalse()));
  technical_impact: Attacker forges authenticated state-changing requests cross-site.
  business_impact: Unauthorized transactions and settings changes cause account takeover.

- id: web-csrf-cookie-samesite-none
  category: vuln
  name: Session cookie SameSite=None weakens CSRF defense
  description: Setting SameSite=None allows the cookie to be sent on cross-site requests.
  severity: medium
  languages:
  - node
  - python
  - php
  - java
  - csharp
  keywords:
  - SameSite
  - None
  regex: '[Ss]ame[Ss]ite\s*[=:]\s*["'']?[Nn]one\b'
  allowlist:
    regex:
    - partitioned
    - Partitioned
  cwe: CWE-352
  owasp: A01:2021 Broken Access Control
  remediation: Use SameSite=Lax or Strict for session cookies unless a cross-site flow strictly requires None.
  secure_code: |
    res.cookie('session', t, { sameSite: 'Lax', httpOnly: true, secure: true });
  technical_impact: Session cookies accompany cross-site requests, re-enabling CSRF.
  business_impact: Forged state changes on authenticated accounts drive fraud and takeover.

- id: web-graphql-introspection-enabled
  category: vuln
  name: GraphQL introspection enabled in production
  description: The GraphQL server config sets introspection true, exposing the full schema.
  severity: low
  languages:
  - node
  keywords:
  - introspection
  regex: introspection\s*:\s*true
  allowlist:
    regex:
    - NODE_ENV
    - development
    - isDev
  cwe: CWE-200
  owasp: A05:2021 Security Misconfiguration
  remediation: Disable introspection in production; gate it behind a development environment check.
  secure_code: |
    introspection: process.env.NODE_ENV !== 'production'
  technical_impact: Attacker enumerates the entire schema, revealing hidden mutations and fields for targeted IDOR.
  business_impact: Accelerated discovery of authorization flaws leading to data breach.

- id: web-graphql-csrf-prevention-disabled
  category: vuln
  name: Apollo Server CSRF prevention disabled
  description: csrfPrevention false lets simple-content-type requests reach GraphQL cross-site.
  severity: medium
  languages:
  - node
  keywords:
  - csrfPrevention
  regex: csrfPrevention\s*:\s*false
  allowlist:
    regex: []
  cwe: CWE-352
  owasp: A05:2021 Security Misconfiguration
  remediation: Leave csrfPrevention enabled so mutations require a preflighted content type or CSRF token.
  secure_code: |
    new ApolloServer({ csrfPrevention: true })
  technical_impact: Cross-site form posts invoke GraphQL mutations with the victim's cookies.
  business_impact: CSRF-driven state changes on authenticated accounts enable takeover.

- id: web-express-trust-proxy-enabled
  category: vuln
  name: Express trust proxy enabled allowing IP spoofing
  description: app.set('trust proxy', true) makes Express trust X-Forwarded-For, spoofable by clients.
  severity: medium
  languages:
  - node
  keywords:
  - trust proxy
  regex: (?:app|express\(\))\.set\s*\(\s*["']trust proxy["']\s*,\s*true
  allowlist:
    regex:
    - loopback
    - \d+\.\d+
    - uniquelocal
  cwe: CWE-348
  owasp: A05:2021 Security Misconfiguration
  remediation: Set trust proxy to a specific hop count or trusted subnet, not the boolean true.
  secure_code: |
    app.set('trust proxy', 1);
  technical_impact: Attacker forges X-Forwarded-For to bypass IP allowlists and rate limits.
  business_impact: Rate-limit and access-control bypass enabling brute force and fraud.

- id: web-prototype-pollution-merge-user-input
  category: vuln
  name: Prototype pollution via recursive merge of user input
  description: A deep-merge/set helper receives req.body/query or JSON.parse output, allowing __proto__ pollution.
  severity: high
  languages:
  - node
  keywords:
  - merge
  - defaultsDeep
  - req.body
  - JSON.parse
  regex: (?:_\.)?(?:merge|mergeWith|defaultsDeep|set|setWith)\s*\([^;]*(?:req\.(?:body|query|params)|request\.body|JSON\.parse)
  context_required:
  - req.body
  - req.query
  - req.params
  - request.body
  - JSON.parse
  allowlist:
    regex:
    - Object.create\(null\)
    - __proto__
    - hasOwnProperty
    - structuredClone
  cwe: CWE-1321
  owasp: A03:2021 Injection
  remediation: Guard __proto__/constructor keys, use null-prototype targets, or upgrade to a patched lodash.
  secure_code: |
    if (key === '__proto__' || key === 'constructor') continue;
  technical_impact: Polluted Object.prototype enables auth bypass, DoS, and RCE through downstream sinks.
  business_impact: Server compromise or privilege escalation across all requests.

- id: web-client-secret-next-public-exposure
  category: vuln
  name: Secret exposed via NEXT_PUBLIC environment variable
  description: A NEXT_PUBLIC_ variable named like a secret is inlined into the client JS bundle.
  severity: high
  languages:
  - node
  - react
  keywords:
  - NEXT_PUBLIC_
  regex: NEXT_PUBLIC_[A-Z0-9_]*(?:SECRET|PRIVATE|PASSWORD|_KEY|APIKEY|TOKEN)\b
  allowlist:
    regex:
    - PUBLISHABLE
    - PUBLIC_KEY
    - CLIENT_ID
    - MAPS_KEY
    - ANALYTICS
  cwe: CWE-200
  owasp: A05:2021 Security Misconfiguration
  remediation: Keep secrets in server-only env vars; never prefix sensitive values with NEXT_PUBLIC_.
  secure_code: |
    const key = process.env.API_SECRET; // server-side only, no NEXT_PUBLIC_
  technical_impact: The secret ships to every browser inside the static bundle and is trivially extracted.
  business_impact: Leaked API keys and tokens enable backend abuse, data theft, and financial loss.

- id: crypto-des-cipher
  category: vuln
  name: Weak Block Cipher (DES / 3DES / DESede)
  description: Use of DES or Triple-DES, both cryptographically broken small-block ciphers.
  severity: high
  languages:
  - java
  - node
  - python
  - csharp
  - php
  keywords:
  - DES
  - TripleDES
  - DESede
  - des-
  regex: (?:Cipher\.getInstance\(\s*["\x27](?:DES|DESede)|createCipheriv\(\s*["\x27]des-|(?:^|[^A-Za-z])DES3?\.new\(|algorithms\.TripleDES|Crypto\.Cipher\.DES\b)
  allowlist:
    regex:
    - AES
    - ChaCha20
  cwe: CWE-327
  owasp: A02:2021 Cryptographic Failures
  remediation: Replace DES/3DES with AES-256-GCM.
  secure_code: |
    Cipher c = Cipher.getInstance("AES/GCM/NoPadding");
  technical_impact: 56/112-bit effective keys and 64-bit blocks allow brute force and SWEET32 recovery.
  business_impact: Encrypted data at rest or in transit can be decrypted by an attacker.

- id: crypto-rc4-cipher
  category: vuln
  name: Weak Stream Cipher (RC4 / ARCFOUR)
  description: Use of the RC4 stream cipher, which has practical keystream biases.
  severity: high
  languages:
  - java
  - node
  - python
  - csharp
  - php
  keywords:
  - RC4
  - ARCFOUR
  - ARC4
  - rc4
  regex: (?:getInstance\(\s*["\x27](?:RC4|ARCFOUR)|createCipheriv\(\s*["\x27]rc4|ARC4\.new\(|algorithms\.ARC4|Crypto\.Cipher\.ARC4)
  cwe: CWE-327
  owasp: A02:2021 Cryptographic Failures
  remediation: Replace RC4 with AES-256-GCM or ChaCha20-Poly1305.
  secure_code: |
    cipher = AES.new(key, AES.MODE_GCM)
  technical_impact: RC4 keystream biases enable plaintext recovery from many ciphertexts.
  business_impact: Confidential data protected with RC4 is recoverable.

- id: crypto-ecb-mode
  category: vuln
  name: Insecure ECB Cipher Mode
  description: Block cipher used in ECB mode, which leaks plaintext structure.
  severity: high
  languages:
  - java
  - node
  - python
  - csharp
  - php
  keywords:
  - ECB
  - ecb
  regex: (?:getInstance\(\s*["\x27][A-Za-z0-9]+/ECB|["\x27][a-z0-9]+-ecb["\x27]|MODE_ECB|CipherMode\.ECB|MCRYPT_MODE_ECB|modes\.ECB\b)
  cwe: CWE-327
  owasp: A02:2021 Cryptographic Failures
  remediation: Use an authenticated mode such as GCM with a random per-message nonce.
  secure_code: |
    Cipher c = Cipher.getInstance("AES/GCM/NoPadding");
  technical_impact: Identical plaintext blocks produce identical ciphertext, revealing patterns.
  business_impact: Structured secrets (images, records) leak despite encryption.

- id: crypto-static-iv
  category: vuln
  name: Static or Zero Initialization Vector
  description: Cipher initialized with an all-zero or hardcoded IV, defeating semantic security.
  severity: medium
  languages:
  - java
  - node
  keywords:
  - IvParameterSpec
  - iv
  - IV
  regex: (?:new IvParameterSpec\(\s*new byte\[\d+\]\s*\)|IvParameterSpec\(\s*["\x27][^"\x27]+["\x27]\.getBytes|iv\s*[:=]\s*Buffer\.from\(\s*["\x27][0-9a-fA-F]{8,}["\x27])
  cwe: CWE-329
  owasp: A02:2021 Cryptographic Failures
  remediation: Generate a fresh cryptographically random IV/nonce per encryption.
  secure_code: |
    byte[] iv = new byte[12]; SecureRandom.getInstanceStrong().nextBytes(iv);
  technical_impact: Reused IVs enable ciphertext correlation and, in GCM, full key/nonce compromise.
  business_impact: Encryption becomes deterministic and recoverable across messages.

- id: crypto-weak-rsa-keysize
  category: vuln
  name: Weak Asymmetric Key Size
  description: RSA/DSA key generated with fewer than 2048 bits.
  severity: high
  languages:
  - java
  - node
  - python
  - go
  keywords:
  - initialize
  - modulusLength
  - RSA.generate
  - key_size
  - genrsa
  - GenerateKey
  regex: (?:\.initialize\(\s*(?:512|768|1024)\b|modulusLength\s*:\s*(?:512|768|1024)\b|RSA\.generate\(\s*(?:512|768|1024)\b|key_size\s*=\s*(?:512|768|1024)\b|rsa\.GenerateKey\([^,]+,\s*(?:512|768|1024)\b|genrsa\D{0,4}(?:512|1024)\b)
  cwe: CWE-326
  owasp: A02:2021 Cryptographic Failures
  remediation: Use RSA >= 2048 bits, or prefer Ed25519 / ECDSA P-256.
  secure_code: |
    kpg.initialize(2048);
  technical_impact: Keys under 2048 bits are factorable with attainable resources.
  business_impact: Signatures and encryption backed by the key can be forged or broken.

- id: rand-math-random-token
  category: vuln
  name: Insecure Randomness for Security Token (Math.random)
  description: Math.random used to generate a security-sensitive value.
  severity: high
  languages:
  - node
  - react
  keywords:
  - Math.random
  regex: Math\.random\s*\(\s*\)
  context_required:
  - token
  - secret
  - password
  - otp
  - nonce
  - salt
  - session
  - apiKey
  - reset
  - csrf
  - verification
  cwe: CWE-338
  owasp: A02:2021 Cryptographic Failures
  remediation: Use crypto.randomBytes or crypto.getRandomValues for security values.
  secure_code: |
    const token = require("crypto").randomBytes(32).toString("hex");
  technical_impact: Math.random is a predictable PRNG whose output can be reconstructed.
  business_impact: Session tokens, OTPs, and reset codes become guessable, enabling takeover.

- id: rand-python-insecure-rng
  category: vuln
  name: Insecure Randomness for Security Value (Python random)
  description: The non-cryptographic random module used for a security-sensitive value.
  severity: high
  languages:
  - python
  keywords:
  - random.
  regex: \brandom\.(?:random|randint|randrange|choice|choices|getrandbits|sample|shuffle|uniform)\s*\(
  context_required:
  - token
  - secret
  - password
  - otp
  - nonce
  - salt
  - session
  - reset
  - csrf
  - apikey
  allowlist:
    regex:
    - SystemRandom
    - secrets\.
  cwe: CWE-338
  owasp: A02:2021 Cryptographic Failures
  remediation: Use the secrets module (secrets.token_urlsafe / token_hex).
  secure_code: |
    import secrets; token = secrets.token_urlsafe(32)
  technical_impact: Mersenne-Twister state is recoverable from a few outputs, making values predictable.
  business_impact: Predictable tokens allow account takeover and auth bypass.

- id: rand-native-insecure-rng
  category: vuln
  name: Insecure Randomness for Security Value (native RNG)
  description: A non-cryptographic RNG used for a security-sensitive value.
  severity: high
  languages:
  - php
  - csharp
  - go
  keywords:
  - mt_rand
  - uniqid
  - new Random
  - math/rand
  - rand.
  regex: (?:\bmt_rand\s*\(|\buniqid\s*\(|new\s+Random\s*\(|math/rand|rand\.(?:Intn|Int|Float64)\()
  context_required:
  - token
  - secret
  - password
  - otp
  - nonce
  - salt
  - session
  - csrf
  - reset
  - apikey
  allowlist:
    regex:
    - RandomNumberGenerator
    - RNGCryptoServiceProvider
    - crypto/rand
  cwe: CWE-338
  owasp: A02:2021 Cryptographic Failures
  remediation: Use a CSPRNG (random_bytes in PHP, RandomNumberGenerator in .NET, crypto/rand in Go).
  secure_code: |
    $token = bin2hex(random_bytes(32));
  technical_impact: These generators are seedable/predictable and unfit for secrets.
  business_impact: Guessable identifiers lead to session hijack and takeover.

- id: jwt-alg-none
  category: vuln
  name: JWT alg none Accepted
  description: JWT configuration allows the none algorithm, disabling signature verification.
  severity: critical
  languages:
  - node
  - python
  - java
  - php
  - go
  - ruby
  keywords:
  - alg
  - none
  - algorithm
  regex: (?i)(?:["\x27]alg["\x27]\s*:\s*["\x27]none["\x27]|algorithms?\s*[:=]\s*\[?\s*["\x27]none["\x27])
  cwe: CWE-347
  owasp: A02:2021 Cryptographic Failures
  remediation: Pin verification to a specific asymmetric or HMAC algorithm; never allow none.
  secure_code: |
    jwt.verify(token, key, { algorithms: ["RS256"] });
  technical_impact: Anyone can forge a token with an empty signature and arbitrary claims.
  business_impact: Complete authentication bypass and impersonation of any user.

- id: jwt-verify-disabled
  category: vuln
  name: JWT Signature Verification Disabled
  description: JWT decoded with signature verification explicitly turned off.
  severity: critical
  languages:
  - python
  - node
  keywords:
  - verify
  - verify_signature
  regex: (?:verify\s*=\s*False|verify_signature["\x27]?\s*[:=]\s*(?:False|false)|["\x27]verify_signature["\x27]\s*:\s*(?:False|false))
  context_required:
  - jwt
  - jose
  - decode
  - verify_signature
  cwe: CWE-347
  owasp: A07:2021 Identification and Authentication Failures
  remediation: Always verify the signature; use decode only for non-trusted introspection.
  secure_code: |
    jwt.decode(token, key, algorithms=["RS256"])  # verify_signature default True
  technical_impact: Unsigned or tampered tokens are accepted as valid.
  business_impact: Attacker forges arbitrary identity and roles.

- id: jwt-algorithm-confusion
  category: vuln
  name: JWT Algorithm Confusion (mixed HS and RS)
  description: Verifier accepts both symmetric and asymmetric algorithms, enabling key confusion.
  severity: high
  languages:
  - node
  - python
  - java
  keywords:
  - algorithms
  - HS256
  - RS256
  regex: algorithms["\x27]?\s*:\s*\[[^\]]*(?:HS(?:256|384|512)[^\]]*RS(?:256|384|512)|RS(?:256|384|512)[^\]]*HS(?:256|384|512))
  cwe: CWE-347
  owasp: A02:2021 Cryptographic Failures
  remediation: Accept exactly one algorithm family matching the key type.
  secure_code: |
    jwt.verify(token, pubKey, { algorithms: ["RS256"] });
  technical_impact: Attacker signs a token with the public key as an HMAC secret and it validates.
  business_impact: Full authentication bypass via forged admin tokens.

- id: jwt-hardcoded-secret
  category: vuln
  name: Hardcoded JWT Signing Secret
  description: JWT signed or keyed with a hardcoded string literal.
  severity: high
  languages:
  - node
  - python
  - java
  keywords:
  - jwt.sign
  - jwt.encode
  - hmacShaKeyFor
  regex: (?:jwt\.sign\([^,]+,\s*["\x27][^"\x27]{4,}["\x27]|jwt\.encode\([^,]+,\s*["\x27][^"\x27]{4,}["\x27]|hmacShaKeyFor\(\s*["\x27][^"\x27]{4,}["\x27])
  allowlist:
    regex:
    - process\.env
    - os\.environ
    - getenv
    - System\.getenv
  cwe: CWE-798
  owasp: A07:2021 Identification and Authentication Failures
  remediation: Load the signing secret from a secrets manager or environment variable.
  secure_code: |
    jwt.sign(payload, process.env.JWT_SECRET);
  technical_impact: The secret is exposed in source, letting anyone mint valid tokens.
  business_impact: Attacker forges tokens for any user, full auth bypass.

- id: cred-url-basic-auth
  category: vuln
  name: Credentials Embedded in Connection URL
  description: Username and password hardcoded inline in a service/connection URL.
  severity: high
  languages:
  - python
  - node
  - java
  - go
  - php
  - ruby
  - csharp
  keywords:
  - ://
  - '@'
  regex: (?:https?|ftp|mongodb(?:\+srv)?|postgres(?:ql)?|mysql|mariadb|redis|amqp|jdbc:[a-z0-9]+)://[^/\s:@"\x27]+:[^/\s@"\x27]+@
  allowlist:
    regex:
    - ://\$\{
    - ://\$
    - user:pass@
    - USER:PASSWORD@
    - ://%
  cwe: CWE-798
  owasp: A07:2021 Identification and Authentication Failures
  remediation: Move credentials to environment variables or a secrets vault.
  secure_code: |
    const url = `mongodb://${process.env.DB_USER}:${process.env.DB_PASS}@host/db`;
  technical_impact: Plaintext credentials are committed to source control.
  business_impact: Anyone with repo access gains direct database or service access.

- id: cred-connstring-password
  category: vuln
  name: Hardcoded Password in Connection String
  description: Literal password inside an ADO/JDBC-style connection string.
  severity: high
  languages:
  - csharp
  - java
  - python
  - php
  - node
  keywords:
  - Password=
  - Pwd=
  - User ID
  - Uid
  regex: (?i)(?:User ID|Uid|Username)\s*=\s*[^;]+;\s*(?:Password|Pwd)\s*=\s*(?!\s*(?:\$|\{|<|%))[^;"\x27\s]{3,}
  cwe: CWE-798
  owasp: A07:2021 Identification and Authentication Failures
  remediation: Reference a secret placeholder resolved at runtime, not a literal.
  secure_code: |
    "Server=db;User ID=app;Password=${DB_PASSWORD}"
  technical_impact: Database credentials are exposed in code and config.
  business_impact: Direct unauthorized database access and data breach.

- id: tls-java-hostname-verify-disabled
  category: vuln
  name: TLS Hostname Verification Disabled (Java)
  description: Java code installs an allow-all hostname verifier.
  severity: high
  languages:
  - java
  keywords:
  - HostnameVerifier
  - ALLOW_ALL
  regex: (?:ALLOW_ALL_HOSTNAME_VERIFIER|NoopHostnameVerifier|set(?:Default)?HostnameVerifier\(\s*(?:\([^)]*\)\s*->\s*true|new\s+HostnameVerifier))
  cwe: CWE-297
  owasp: A07:2021 Identification and Authentication Failures
  remediation: Use the default strict verifier and a properly configured trust store.
  secure_code: |
    // rely on default HttpsURLConnection hostname verification
  technical_impact: A MITM presenting any valid certificate for a wrong host is accepted.
  business_impact: TLS traffic can be intercepted and modified.

- id: tls-java-trustall-manager
  category: vuln
  name: TLS Trust-All TrustManager (Java)
  description: X509TrustManager with an empty check method that accepts any certificate.
  severity: high
  languages:
  - java
  keywords:
  - checkServerTrusted
  - checkClientTrusted
  regex: (?:checkServerTrusted|checkClientTrusted)\s*\([^)]*\)\s*(?:throws\s+[A-Za-z0-9_.]+\s*)?\{\s*\}
  cwe: CWE-295
  owasp: A07:2021 Identification and Authentication Failures
  remediation: Validate the chain against a trust store; do not implement a no-op trust manager.
  secure_code: |
    // use the platform default TrustManagerFactory
  technical_impact: Any certificate, including self-signed and attacker ones, is trusted.
  business_impact: Full MITM interception of encrypted connections.

- id: tls-go-insecure-skip-verify
  category: vuln
  name: TLS Verification Disabled (Go InsecureSkipVerify)
  description: Go TLS config sets InsecureSkipVerify to true.
  severity: high
  languages:
  - go
  keywords:
  - InsecureSkipVerify
  regex: InsecureSkipVerify\s*:\s*true
  cwe: CWE-295
  owasp: A07:2021 Identification and Authentication Failures
  remediation: Remove InsecureSkipVerify and configure a proper RootCAs pool.
  secure_code: |
    tls.Config{ MinVersion: tls.VersionTLS12 }
  technical_impact: Server certificate and hostname are not validated.
  business_impact: MITM attacker can decrypt and alter traffic.

- id: tls-csharp-cert-validation-bypass
  category: vuln
  name: TLS Certificate Validation Bypass (.NET)
  description: Certificate validation callback unconditionally returns true.
  severity: high
  languages:
  - csharp
  keywords:
  - CertificateValidationCallback
  - DangerousAccept
  regex: (?:ServerCertificateValidationCallback|ServerCertificateCustomValidationCallback|RemoteCertificateValidationCallback)\b[^;]*(?:=>\s*true|return\s+true|DangerousAcceptAnyServerCertificateValidator)
  cwe: CWE-295
  owasp: A07:2021 Identification and Authentication Failures
  remediation: Remove the override; let the platform validate certificates.
  secure_code: |
    using var client = new HttpClient(); // default validation
  technical_impact: All certificates are accepted regardless of chain or host.
  business_impact: TLS confidentiality and integrity are lost to MITM.

- id: tls-php-curl-verify-disabled
  category: vuln
  name: TLS Peer Verification Disabled (PHP cURL)
  description: cURL configured with SSL peer or host verification turned off.
  severity: high
  languages:
  - php
  keywords:
  - CURLOPT_SSL_VERIFYPEER
  - CURLOPT_SSL_VERIFYHOST
  regex: CURLOPT_SSL_VERIFY(?:PEER|HOST)\s*(?:,|=>)\s*(?:false|0|FALSE)\b
  cwe: CWE-295
  owasp: A07:2021 Identification and Authentication Failures
  remediation: Set CURLOPT_SSL_VERIFYPEER to true and CURLOPT_SSL_VERIFYHOST to 2.
  secure_code: |
    curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, true);
  technical_impact: Certificate chain and hostname are not checked.
  business_impact: Outbound requests are trivially interceptable.

- id: tls-legacy-protocol-version
  category: vuln
  name: Legacy TLS/SSL Protocol Version Pinned
  description: Code pins an obsolete protocol (SSLv2/3, TLS 1.0/1.1).
  severity: medium
  languages:
  - java
  - python
  - node
  - csharp
  - go
  keywords:
  - SSLv3
  - TLSv1
  - PROTOCOL_
  - SslProtocols
  - secureProtocol
  - VersionTLS10
  regex: (?:getInstance\(\s*["\x27](?:SSLv3|SSLv2|TLSv1|TLSv1\.1|TLSv1_1)["\x27]|PROTOCOL_(?:SSLv3|SSLv23|TLSv1|TLSv1_1)\b|secureProtocol\s*:\s*["\x27](?:SSLv3|TLSv1|TLSv1_1|TLSv1_method|TLSv1_1_method)|minVersion\s*:\s*["\x27]TLSv1(?:\.1)?["\x27]|SslProtocols\.(?:Ssl2|Ssl3|Tls|Tls11)\b|tls\.Version(?:SSL30|TLS10|TLS11)\b)
  cwe: CWE-327
  owasp: A02:2021 Cryptographic Failures
  remediation: Require TLS 1.2 or higher.
  secure_code: |
    SSLContext.getInstance("TLSv1.3");
  technical_impact: Downgrade and padding-oracle attacks (POODLE, BEAST) become viable.
  business_impact: Encrypted sessions can be downgraded and decrypted.

- id: auth-timing-unsafe-secret-compare
  category: vuln
  name: Timing-Unsafe Secret Comparison
  description: Secret, token, or signature compared with a non-constant-time operator.
  severity: medium
  languages:
  - node
  - python
  - java
  - php
  - ruby
  - go
  keywords:
  - ==
  - '!='
  - token
  - secret
  - password
  - hmac
  - signature
  regex: (?i)\b(?:signature|hmac|auth_?tag|mac|token|secret|passwd|password|api_?key|digest)\s*(?:===|==|!==|!=)\s*(?![=\s]*(?:null|None|undefined|["\x27]["\x27]))
  allowlist:
    regex:
    - timingSafeEqual
    - compare_digest
    - hash_equals
    - MessageDigest\.isEqual
    - ConstantTimeCompare
  cwe: CWE-208
  owasp: A02:2021 Cryptographic Failures
  remediation: Compare secrets with a constant-time function.
  secure_code: |
    crypto.timingSafeEqual(Buffer.from(a), Buffer.from(b));
  technical_impact: Byte-by-byte short-circuit comparison leaks the secret via timing.
  business_impact: Attacker recovers API keys or HMAC tags through timing analysis.

- id: auth-hardcoded-credential-compare
  category: vuln
  name: Hardcoded Credential Comparison
  description: Password, secret, or token checked against a hardcoded string literal.
  severity: high
  languages:
  - node
  - python
  - java
  - php
  - csharp
  - ruby
  keywords:
  - password
  - secret
  - api_key
  - token
  - ==
  regex: (?i)\b(?:password|passwd|pwd|secret|api_?key|auth_?token|access_?token)\b\s*(?:===|==|\.equals\(\s*)["\x27][^"\x27]{3,}["\x27]
  cwe: CWE-798
  owasp: A07:2021 Identification and Authentication Failures
  remediation: Verify credentials against a hashed store, never a literal.
  secure_code: |
    if (bcrypt.compareSync(input, user.passwordHash)) { ... }
  technical_impact: A backdoor or shared static credential is embedded in code.
  business_impact: Anyone reading the source authenticates with the known value.

- id: session-hardcoded-secret
  category: vuln
  name: Hardcoded Session Signing Secret
  description: Express session or cookie parser initialized with a literal secret.
  severity: high
  languages:
  - node
  keywords:
  - session
  - cookieParser
  - secret
  regex: (?:session\(\s*\{[^}]*secret\s*:\s*["\x27][^"\x27]+["\x27]|cookieSession\(\s*\{[^}]*secret\s*:\s*["\x27][^"\x27]+["\x27]|cookieParser\(\s*["\x27][^"\x27]+["\x27])
  allowlist:
    regex:
    - process\.env
  cwe: CWE-798
  owasp: A07:2021 Identification and Authentication Failures
  remediation: Load the session secret from the environment.
  secure_code: |
    app.use(session({ secret: process.env.SESSION_SECRET }));
  technical_impact: Known secret lets an attacker forge or tamper signed session cookies.
  business_impact: Session forgery leading to account takeover.

- id: saml-signature-verification-disabled
  category: vuln
  name: SAML Assertion Signature Not Required
  description: SAML config disables assertion/response signature enforcement.
  severity: high
  languages:
  - node
  - python
  - php
  - java
  keywords:
  - wantAssertionsSigned
  - want_assertions_signed
  - validateSignature
  regex: (?i)(?:want(?:AssertionsSigned|MessageSigned|AuthnResponseSigned)|want_assertions_signed)\s*[:=]\s*(?:false|False)|validateSignature\s*[:=]\s*(?:false|False)|checkResponseSignature\s*[:=]\s*(?:false|False)
  cwe: CWE-347
  owasp: A07:2021 Identification and Authentication Failures
  remediation: Require signed assertions and validate against the IdP certificate.
  secure_code: |
    { wantAssertionsSigned: true, wantMessageSigned: true }
  technical_impact: Unsigned or stripped-signature assertions are accepted.
  business_impact: Attacker forges a SAML assertion to log in as any user or admin.

- id: oauth-redirect-uri-wildcard
  category: vuln
  name: OAuth Wildcard Redirect URI
  description: Registered OAuth redirect URI contains a wildcard, weakening validation.
  severity: medium
  languages:
  - node
  - python
  - php
  - java
  - go
  keywords:
  - redirect_uri
  - redirectUri
  - '*'
  regex: (?i)redirect_uris?["\x27]?\s*[:=]\s*["\x27][^"\x27]*\*
  cwe: CWE-601
  owasp: A01:2021 Broken Access Control
  remediation: Register exact, fully-qualified redirect URIs with no wildcards.
  secure_code: |
    redirect_uris: ["https://app.example.com/oauth/callback"]
  technical_impact: A wildcard lets an attacker land the auth code on a controlled host.
  business_impact: OAuth code/token theft leading to account takeover.

- id: xxe-parser-external-entities
  category: vuln
  name: XML Parser With External Entities Enabled
  description: XML parser explicitly configured to resolve DTDs / external entities.
  severity: high
  languages:
  - java
  - csharp
  - php
  - python
  keywords:
  - doctype
  - XmlResolver
  - DtdProcessing
  - libxml_disable_entity_loader
  - resolve_entities
  - external-general-entities
  regex: (?:disallow-doctype-decl["\x27]\s*,\s*false|external-general-entities["\x27]\s*,\s*true|setExpandEntityReferences\(\s*true|DtdProcessing\.Parse|new\s+XmlUrlResolver|ProhibitDtd\s*=\s*false|libxml_disable_entity_loader\(\s*false|resolve_entities\s*=\s*True|feature_external_ges\s*,\s*(?:True|1)|XMLParser\([^)]*resolve_entities\s*=\s*True)
  cwe: CWE-611
  owasp: A05:2021 Security Misconfiguration
  remediation: Disable DTDs and external entity resolution in the parser.
  secure_code: |
    dbf.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
  technical_impact: XXE allows local file read, SSRF, and denial of service.
  business_impact: Internal files and metadata endpoints are exfiltrated via crafted XML.

- id: log-sensitive-data-exposure
  category: vuln
  name: Sensitive Data Written to Logs
  description: Password, secret, token, or key passed into a logging/print call.
  severity: medium
  languages:
  - node
  - python
  - java
  - go
  - php
  keywords:
  - log
  - print
  - password
  - secret
  - token
  regex: (?i)(?:console\.(?:log|debug|info|warn|error)|logger?\.(?:debug|info|warn|error|trace)|System\.out\.print(?:ln)?|fmt\.Print(?:f|ln)?|print)\s*\([^)]*(?:password|passwd|secret|api_?key|access_?token|private_?key|credentials?)\b
  allowlist:
    regex:
    - redact
    - mask
    - \*\*\*
    - passwordPolicy
    - hasPassword
    - resetPasswordUrl
  cwe: CWE-532
  owasp: A09:2021 Security Logging and Monitoring Failures
  remediation: Redact or omit secrets before logging.
  secure_code: |
    logger.info("auth ok for user %s", user.id)  # no secret
  technical_impact: Credentials persist in log files and aggregation systems.
  business_impact: Log access (or a log leak) yields plaintext credentials.

- id: iac-tf-s3-public-acl
  category: vuln
  name: Terraform S3 Bucket Public ACL
  description: S3 bucket/object ACL set to a public-read or public-read-write canned ACL.
  severity: high
  languages:
  - terraform
  keywords:
  - public-read
  - acl
  regex: acl\s*=\s*["\x27]public-read(?:-write)?["\x27]
  cwe: CWE-732
  owasp: A05:2021 Security Misconfiguration
  remediation: Use private ACL and an aws_s3_bucket_public_access_block.
  secure_code: |
    acl = "private"
  technical_impact: Bucket contents are readable (or writable) by anyone on the internet.
  business_impact: Data exposure or attacker-controlled content injection.

- id: iac-tf-open-security-group
  category: vuln
  name: Terraform Security Group Open to World
  description: Security group rule allows 0.0.0.0/0 or ::/0.
  severity: medium
  languages:
  - terraform
  keywords:
  - 0.0.0.0/0
  - cidr_blocks
  - ::/0
  regex: cidr_blocks\s*=\s*\[[^\]]*["\x27](?:0\.0\.0\.0/0|::/0)["\x27]
  cwe: CWE-284
  owasp: A05:2021 Security Misconfiguration
  remediation: Restrict ingress CIDRs to known networks; avoid world-open ingress.
  secure_code: |
    cidr_blocks = ["10.0.0.0/16"]
  technical_impact: Exposed ports (SSH/RDP/DB) reachable from the entire internet.
  business_impact: Brute-force and direct exploitation of internal services.

- id: iac-tf-public-access-block-disabled
  category: vuln
  name: Terraform S3 Public Access Block Disabled
  description: S3 public access block guardrail set to false.
  severity: high
  languages:
  - terraform
  keywords:
  - block_public_acls
  - restrict_public_buckets
  - ignore_public_acls
  regex: (?:block_public_acls|block_public_policy|ignore_public_acls|restrict_public_buckets)\s*=\s*false
  cwe: CWE-732
  owasp: A05:2021 Security Misconfiguration
  remediation: Set all four public access block settings to true.
  secure_code: |
    block_public_acls = true
    restrict_public_buckets = true
  technical_impact: Bucket or ACL policies can expose objects publicly.
  business_impact: Accidental public exposure of stored data.

- id: iac-tf-rds-publicly-accessible
  category: vuln
  name: Terraform RDS Publicly Accessible
  description: RDS/database instance flagged publicly_accessible = true.
  severity: high
  languages:
  - terraform
  keywords:
  - publicly_accessible
  regex: publicly_accessible\s*=\s*true
  cwe: CWE-284
  owasp: A05:2021 Security Misconfiguration
  remediation: Set publicly_accessible = false and place the DB in a private subnet.
  secure_code: |
    publicly_accessible = false
  technical_impact: Database gets a public endpoint reachable from the internet.
  business_impact: Direct database attack surface and potential data breach.

- id: iac-tf-hardcoded-secret
  category: vuln
  name: Terraform Hardcoded Secret
  description: Password, secret, token, or access key hardcoded as a literal in Terraform.
  severity: high
  languages:
  - terraform
  keywords:
  - password
  - secret
  - access_key
  - token
  regex: (?i)(?:password|secret|access_key|token)\s*=\s*"[^"${][^"]*"
  allowlist:
    regex:
    - var\.
    - data\.
    - random_password
  cwe: CWE-798
  owasp: A05:2021 Security Misconfiguration
  remediation: Use variables, a secrets manager data source, or random_password.
  secure_code: |
    password = var.db_password
  technical_impact: Secrets are committed to version control in plaintext.
  business_impact: Anyone with repo/state access obtains live credentials.

- id: iac-docker-curl-pipe-shell
  category: vuln
  name: Remote Script Piped to Shell
  description: Downloaded script piped directly into a shell interpreter.
  severity: high
  languages:
  - dockerfile
  - yaml
  keywords:
  - curl
  - wget
  - '| bash'
  - '| sh'
  regex: (?:curl|wget)\s+[^|\n]*\|\s*(?:sudo\s+)?(?:bash|sh|zsh)\b
  cwe: CWE-494
  owasp: A08:2021 Software and Data Integrity Failures
  remediation: Pin and checksum-verify the artifact before execution.
  secure_code: |
    RUN curl -fsSLo i.sh https://x/i.sh && echo "<sha256>  i.sh" | sha256sum -c && sh i.sh
  technical_impact: A compromised or MITM'd endpoint runs arbitrary code at build time.
  business_impact: Supply-chain compromise of the built image.

- id: iac-docker-user-root
  category: vuln
  name: Dockerfile Runs as Root
  description: Dockerfile explicitly sets the runtime user to root.
  severity: low
  languages:
  - dockerfile
  keywords:
  - USER root
  regex: ^\s*USER\s+root\b
  cwe: CWE-250
  owasp: A05:2021 Security Misconfiguration
  remediation: Create and switch to a non-root user before CMD/ENTRYPOINT.
  secure_code: |
    RUN adduser -D app
    USER app
  technical_impact: A container breakout inherits root on the host namespace.
  business_impact: Larger blast radius if the containerized app is compromised.

- id: iac-k8s-privileged-container
  category: vuln
  name: Kubernetes Privileged Container
  description: Container security context requests privileged mode.
  severity: high
  languages:
  - yaml
  keywords:
  - privileged
  regex: privileged\s*:\s*true
  cwe: CWE-250
  owasp: A05:2021 Security Misconfiguration
  remediation: Remove privileged; grant only the specific capabilities required.
  secure_code: |
    securityContext:
      privileged: false
  technical_impact: The container gains near-root access to the host kernel and devices.
  business_impact: Container escape leading to full node compromise.

- id: iac-k8s-host-namespace
  category: vuln
  name: Kubernetes Host Namespace Sharing
  description: Pod shares the host PID, network, or IPC namespace.
  severity: high
  languages:
  - yaml
  keywords:
  - hostPID
  - hostNetwork
  - hostIPC
  regex: host(?:PID|Network|IPC)\s*:\s*true
  cwe: CWE-668
  owasp: A05:2021 Security Misconfiguration
  remediation: Do not share host namespaces unless strictly required.
  secure_code: |
    spec:
      hostPID: false
      hostNetwork: false
  technical_impact: Pod can observe/interfere with host processes, network, and IPC.
  business_impact: Lateral movement and node-level compromise.

- id: iac-k8s-allow-privilege-escalation
  category: vuln
  name: Kubernetes Privilege Escalation Allowed
  description: Container allows privilege escalation or runs as root.
  severity: medium
  languages:
  - yaml
  keywords:
  - allowPrivilegeEscalation
  - runAsNonRoot
  regex: (?:allowPrivilegeEscalation\s*:\s*true|runAsNonRoot\s*:\s*false)
  cwe: CWE-250
  owasp: A05:2021 Security Misconfiguration
  remediation: Set allowPrivilegeEscalation false and runAsNonRoot true.
  secure_code: |
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
  technical_impact: A process can gain more privileges than its parent (setuid, capabilities).
  business_impact: Easier container escape and host compromise.

- id: iac-k8s-dangerous-capabilities
  category: vuln
  name: Kubernetes Dangerous Linux Capabilities
  description: Container adds SYS_ADMIN, NET_ADMIN, SYS_PTRACE, or ALL capabilities.
  severity: high
  languages:
  - yaml
  keywords:
  - SYS_ADMIN
  - NET_ADMIN
  - capabilities
  - add
  regex: (?:add:\s*\[[^\]]*\b(?:SYS_ADMIN|NET_ADMIN|NET_RAW|SYS_PTRACE|ALL)\b|^\s*-\s+(?:SYS_ADMIN|NET_ADMIN|SYS_PTRACE|ALL)\s*$)
  cwe: CWE-250
  owasp: A05:2021 Security Misconfiguration
  remediation: Drop ALL capabilities and add back only the minimal required set.
  secure_code: |
    capabilities:
      drop: ["ALL"]
  technical_impact: Elevated capabilities enable mounts, ptrace, and raw sockets that aid escape.
  business_impact: Container-to-host breakout risk.

- id: iac-gha-untrusted-input-injection
  category: vuln
  name: GitHub Actions Untrusted Input Expression Injection
  description: Attacker-controlled github.event field interpolated directly into a workflow.
  severity: high
  languages:
  - yaml
  keywords:
  - github.event
  - ${{
  regex: \$\{\{\s*github\.event\.(?:issue|pull_request|comment|review|head_commit|discussion)[^}]*\.(?:title|body|name|ref|label|message|email|login|description)
  cwe: CWE-94
  owasp: A03:2021 Injection
  remediation: Pass the value via an env var and reference it quoted in the shell.
  secure_code: |
    env: { TITLE: ${{ github.event.pull_request.title }} }
    run: echo "$TITLE"
  technical_impact: A newline or backtick in the field executes attacker shell in the runner.
  business_impact: Secret exfiltration and repository compromise via a fork PR.

- id: iac-gha-prtarget-checkout-untrusted
  category: vuln
  name: GitHub Actions Checkout of Untrusted PR Ref
  description: Workflow checks out the PR head ref, running attacker code with privileges.
  severity: high
  languages:
  - yaml
  keywords:
  - pull_request.head
  - 'ref:'
  regex: ref\s*:\s*\$\{\{\s*github\.event\.pull_request\.head\.(?:ref|sha)
  cwe: CWE-829
  owasp: A08:2021 Software and Data Integrity Failures
  remediation: Avoid pull_request_target with a head checkout; use pull_request or gate on approval.
  secure_code: |
    on: pull_request  # runs without secrets/write token
  technical_impact: Untrusted fork code executes in a context holding the write GITHUB_TOKEN and secrets.
  business_impact: Pwnrequest secret theft and pushes to protected branches.

# ============ Extended rules mined from bughunting/bughunting2 skills ============
- id: dotnet-request-validation-disabled
  category: vuln
  name: ASP.NET Request Validation Disabled
  description: validateRequest="false" or requestValidationMode="2.0" turns off the built-in XSS/markup request filter.
  severity: medium
  languages:
  - xml
  - html
  keywords:
  - validateRequest="false"
  - requestValidationMode="2.0"
  - validateRequest
  regex: validateRequest\s*=\s*"false"|requestValidationMode\s*=\s*"2\.0"
  cwe: CWE-20
  owasp: A03:2021 Injection
  remediation: Leave request validation enabled (default) and HTML-encode output; scope any exception to a single field.
  secure_code: |
    <pages validateRequest="true" />
    <httpRuntime requestValidationMode="4.5" targetFramework="4.8" />
  technical_impact: The framework no longer rejects markup in query/form input, re-opening reflected and stored XSS sinks.
  business_impact: Session theft and account takeover through cross-site scripting on any page that echoes user input.

- id: csharp-request-validation-attribute
  category: vuln
  name: ASP.NET MVC ValidateInput(false)
  description: The [ValidateInput(false)] attribute disables request validation for a controller or action.
  severity: medium
  languages:
  - csharp
  keywords:
  - ValidateInput
  - ValidateInput(false
  regex: \[\s*ValidateInput\s*\(\s*false\s*\)\s*\]
  cwe: CWE-20
  owasp: A03:2021 Injection
  remediation: Remove the attribute; use [AllowHtml] on the single property that legitimately accepts markup, plus a sanitizer.
  secure_code: |
    [HttpPost]
    public ActionResult Save([AllowHtml] string bio) { bio = _sanitizer.Sanitize(bio); }
  technical_impact: Raw markup reaches the action's model, enabling XSS and HTML injection through that endpoint.
  business_impact: Attacker-controlled scripts execute in victim browsers, leading to credential and session compromise.

- id: dotnet-viewstate-mac-disabled
  category: vuln
  name: ASP.NET ViewState MAC Disabled
  description: enableViewStateMac="false" removes the integrity signature that prevents ViewState tampering.
  severity: high
  languages:
  - xml
  - html
  keywords:
  - enableViewStateMac="false"
  - enableViewStateMac
  regex: enableViewStateMac\s*=\s*"false"
  cwe: CWE-345
  owasp: A08:2021 Software and Data Integrity Failures
  remediation: Never disable ViewState MAC; keep enableViewStateMac="true" and use a fixed, secret machineKey across the farm.
  secure_code: |
    <pages enableViewStateMac="true" viewStateEncryptionMode="Always" />
  technical_impact: Unsigned ViewState is attacker-forgeable, and the LosFormatter deserialization path yields remote code execution.
  business_impact: Full server compromise under the application-pool identity via a forged ViewState payload.

- id: dotnet-viewstate-encryption-never
  category: vuln
  name: ASP.NET ViewState Encryption Disabled
  description: viewStateEncryptionMode="Never" leaves ViewState signed-only, exposing its contents and easing forgery if the key leaks.
  severity: medium
  languages:
  - xml
  - html
  keywords:
  - viewStateEncryptionMode="Never"
  - viewStateEncryptionMode
  regex: viewStateEncryptionMode\s*=\s*"Never"
  cwe: CWE-311
  owasp: A02:2021 Cryptographic Failures
  remediation: Set viewStateEncryptionMode="Always" so ViewState is both encrypted and signed.
  secure_code: |
    <pages viewStateEncryptionMode="Always" enableViewStateMac="true" />
  technical_impact: Sensitive server-side control state is readable, and a recovered validation key alone permits ViewState forgery.
  business_impact: Disclosure of internal state plus a shorter path to ViewState-deserialization remote code execution.

- id: dotnet-debug-enabled
  category: vuln
  name: ASP.NET Debug Compilation Enabled in Production
  description: <compilation debug="true"> ships verbose errors, disables optimizations, and lengthens request timeouts.
  severity: medium
  languages:
  - xml
  keywords:
  - debug="true"
  - compilation
  regex: <compilation[^>]*\bdebug\s*=\s*"true"
  cwe: CWE-489
  owasp: A05:2021 Security Misconfiguration
  remediation: Set debug="false" for production deployments and enable <deployment retail="true"/> on the server.
  secure_code: |
    <compilation debug="false" targetFramework="4.8" />
  technical_impact: Detailed exception pages leak source paths, versions, and stack traces, and the app is more DoS-prone.
  business_impact: Reconnaissance data handed to attackers and degraded availability under load.

- id: dotnet-custom-errors-off
  category: vuln
  name: ASP.NET customErrors Off (Stack Trace Disclosure)
  description: <customErrors mode="Off"> returns full stack traces and framework banners to remote clients.
  severity: medium
  languages:
  - xml
  keywords:
  - customErrors
  - mode="Off"
  regex: <customErrors[^>]*\bmode\s*=\s*"Off"
  cwe: CWE-209
  owasp: A05:2021 Security Misconfiguration
  remediation: Use mode="RemoteOnly" (or On) with a generic defaultRedirect error page in production.
  secure_code: |
    <customErrors mode="RemoteOnly" defaultRedirect="~/Error" />
  technical_impact: Yellow-screen-of-death pages expose method names, file paths, connection strings, and exact patch levels.
  business_impact: Internal architecture and occasionally credentials are disclosed to anonymous internet users.

- id: dotnet-trace-enabled
  category: vuln
  name: ASP.NET Trace Enabled
  description: <trace enabled="true"> exposes trace.axd with recent requests, headers, cookies, and form values.
  severity: high
  languages:
  - xml
  keywords:
  - <trace
  - enabled="true"
  regex: <trace[^>]*\benabled\s*=\s*"true"
  cwe: CWE-215
  owasp: A05:2021 Security Misconfiguration
  remediation: Disable tracing in production (enabled="false") and never set localOnly="false".
  secure_code: |
    <trace enabled="false" localOnly="true" />
  technical_impact: trace.axd dumps live request data including Authorization headers, session cookies, and posted form fields.
  business_impact: Direct leakage of user session tokens and PII enabling session hijacking.

- id: csharp-path-traversal-mappath
  category: vuln
  name: .NET Path Traversal via Server.MapPath
  description: Server.MapPath called on Request input lets an attacker traverse outside the intended directory.
  severity: high
  languages:
  - csharp
  keywords:
  - Server.MapPath
  - MapPath
  regex: Server\.MapPath\([^)]*Request
  context_required:
  - Request
  - Request.QueryString
  - Request.Form
  - Request.Params
  allowlist:
    regex:
    - Path\.GetFileName\(
  cwe: CWE-22
  owasp: A01:2021 Broken Access Control
  remediation: Strip the path with Path.GetFileName, resolve, then verify the result stays under the intended root.
  secure_code: |
    var name = Path.GetFileName(Request["file"]);
    var full = Server.MapPath("~/uploads/" + name);
  technical_impact: Attacker resolves arbitrary server paths (../../web.config) for read or write access.
  business_impact: Disclosure of configuration secrets and connection strings, or arbitrary file write to a web-executable path.

- id: csharp-path-traversal-fileio
  category: vuln
  name: .NET Path Traversal via File I/O
  description: File.ReadAll*/OpenRead or Path.Combine fed with Request input allows directory traversal file access.
  severity: high
  languages:
  - csharp
  keywords:
  - File.ReadAll
  - Path.Combine
  - File.OpenRead
  regex: File\.(?:ReadAllText|ReadAllBytes|ReadAllLines|OpenRead|OpenText|WriteAllText)\([^)]*Request|Path\.Combine\([^)]*Request
  context_required:
  - Request
  - Request.QueryString
  - Request.Form
  - Request.Params
  allowlist:
    regex:
    - Path\.GetFileName\(
    - StartsWith\(
  cwe: CWE-22
  owasp: A01:2021 Broken Access Control
  remediation: Canonicalize with Path.GetFullPath and reject any result that does not start with the whitelisted base directory.
  secure_code: |
    var full = Path.GetFullPath(Path.Combine(baseDir, Path.GetFileName(Request["f"])));
    if (!full.StartsWith(baseDir)) return Forbid();
  technical_impact: Reads or writes files outside the web root via ../ sequences in user input.
  business_impact: Theft of secrets and source, or remote code execution through a written .aspx handler.

- id: csharp-ssrf-httpclient
  category: vuln
  name: .NET SSRF via HttpClient
  description: HttpClient request methods invoked with a Request-controlled URL permit server-side request forgery.
  severity: high
  languages:
  - csharp
  keywords:
  - GetAsync
  - PostAsync
  - SendAsync
  regex: \.(?:GetAsync|GetStringAsync|GetByteArrayAsync|GetStreamAsync|PostAsync|PutAsync|SendAsync)\([^)]*Request
  context_required:
  - Request
  - Request.QueryString
  - Request.Form
  - Request.Params
  cwe: CWE-918
  owasp: A10:2021 Server-Side Request Forgery
  remediation: Allowlist destination hosts and schemes, resolve DNS, and block link-local/private ranges before the call.
  secure_code: |
    if (!AllowedHosts.Contains(new Uri(url).Host)) return BadRequest();
    var resp = await _http.GetAsync(url);
  technical_impact: Attacker drives outbound requests to cloud metadata (169.254.169.254) and internal-only services.
  business_impact: Theft of cloud IAM credentials and reach into the internal network for lateral movement.

- id: csharp-ssrf-legacy-webrequest
  category: vuln
  name: .NET SSRF via WebRequest/WebClient
  description: WebRequest.Create or WebClient download methods called with Request input allow server-side request forgery.
  severity: high
  languages:
  - csharp
  keywords:
  - WebRequest.Create
  - DownloadString
  - DownloadData
  regex: WebRequest\.Create\([^)]*Request|\.(?:DownloadString|DownloadData|DownloadFile|OpenRead)\([^)]*Request
  context_required:
  - Request
  - Request.QueryString
  - Request.Form
  - Request.Params
  cwe: CWE-918
  owasp: A10:2021 Server-Side Request Forgery
  remediation: Validate the URI against an allowlist of hosts and schemes and forbid redirects to private ranges.
  secure_code: |
    var uri = new Uri(input);
    if (uri.Scheme != Uri.UriSchemeHttps || !Allowed.Contains(uri.Host)) throw new SecurityException();
  technical_impact: Server fetches attacker-chosen internal URLs, exposing metadata endpoints and admin panels.
  business_impact: Cloud credential compromise and internal service access from a single request.

- id: csharp-open-redirect
  category: vuln
  name: .NET Open Redirect
  description: Response.Redirect or MVC Redirect built from Request input sends users to an attacker-chosen URL.
  severity: medium
  languages:
  - csharp
  keywords:
  - Response.Redirect
  - return Redirect
  regex: Response\.Redirect(?:Permanent)?\([^)]*Request|return\s+Redirect\([^)]*Request
  context_required:
  - Request
  - Request.QueryString
  - Request.Form
  - Request.Params
  allowlist:
    regex:
    - Url\.IsLocalUrl\(
    - RedirectToAction\(
  cwe: CWE-601
  owasp: A01:2021 Broken Access Control
  remediation: Only redirect to local URLs; gate with Url.IsLocalUrl or a strict allowlist of absolute targets.
  secure_code: |
    var next = Request["returnUrl"];
    return Url.IsLocalUrl(next) ? Redirect(next) : RedirectToAction("Index");
  technical_impact: The application vouches for a redirect to an external phishing or token-stealing page.
  business_impact: Credential phishing and OAuth token theft leveraging the trusted domain.

- id: csharp-ldap-injection-filter
  category: vuln
  name: .NET LDAP Injection via DirectorySearcher.Filter
  description: A DirectorySearcher filter assembled by concatenating user input allows LDAP filter injection.
  severity: high
  languages:
  - csharp
  keywords:
  - .Filter
  - DirectorySearcher
  regex: \.Filter\s*=\s*[^;]*"\s*\+|new\s+DirectorySearcher\([^)]*"\s*\+
  context_required:
  - +
  - Request
  - user
  cwe: CWE-90
  owasp: A03:2021 Injection
  remediation: Escape input for LDAP (each special char to its \\XX form) before inserting it into the filter.
  secure_code: |
    var safe = LdapEncoder.FilterEncode(Request["u"]);
    searcher.Filter = "(sAMAccountName=" + safe + ")";
  technical_impact: Attacker rewrites the LDAP query to bypass filters or enumerate directory objects.
  business_impact: Authentication bypass and mass disclosure of directory user records.

- id: csharp-xpath-injection
  category: vuln
  name: .NET XPath Injection
  description: SelectNodes/SelectSingleNode/Evaluate with a concatenated user string enables XPath injection.
  severity: high
  languages:
  - csharp
  keywords:
  - SelectNodes
  - SelectSingleNode
  - Evaluate
  regex: \.(?:SelectNodes|SelectSingleNode|Evaluate)\([^)]*"\s*\+
  context_required:
  - +
  - Request
  - user
  cwe: CWE-643
  owasp: A03:2021 Injection
  remediation: Use a parameterized XPathExpression with XsltArgumentList/variables instead of string concatenation.
  secure_code: |
    var expr = nav.Compile("/users/user[@name=$n]");
    var args = new XsltArgumentList(); args.AddParam("n", "", Request["u"]);
  technical_impact: Attacker alters the XPath query to return unauthorized nodes or bypass authentication logic.
  business_impact: Disclosure of the full XML data store and login bypass on XML-backed auth.

- id: csharp-deserialization-unsafe-formatter
  category: vuln
  name: Unsafe .NET Type-Aware Serializer
  description: NetDataContractSerializer, LosFormatter, ObjectStateFormatter, or SoapFormatter embed type info and enable gadget-chain RCE on untrusted input.
  severity: critical
  languages:
  - csharp
  keywords:
  - NetDataContractSerializer
  - LosFormatter
  - ObjectStateFormatter
  - SoapFormatter
  regex: new\s+(?:NetDataContractSerializer|LosFormatter|ObjectStateFormatter|SoapFormatter)\s*\(
  cwe: CWE-502
  owasp: A08:2021 Software and Data Integrity Failures
  remediation: Never deserialize untrusted data with type-aware formatters; use DataContractSerializer with a fixed known type or System.Text.Json.
  secure_code: |
    var ser = new DataContractSerializer(typeof(Order));
    var order = (Order)ser.ReadObject(trustedStream);
  technical_impact: A crafted payload instantiates gadget types (TypeConfuseDelegate) yielding arbitrary command execution.
  business_impact: Full remote code execution and server takeover from any deserialized attacker input.

- id: csharp-deserialization-jsserializer-resolver
  category: vuln
  name: JavaScriptSerializer with Type Resolver
  description: JavaScriptSerializer constructed with a JavaScriptTypeResolver honors __type, allowing polymorphic deserialization RCE.
  severity: critical
  languages:
  - csharp
  keywords:
  - JavaScriptSerializer
  - Resolver
  regex: new\s+JavaScriptSerializer\([^)]*Resolver
  cwe: CWE-502
  owasp: A08:2021 Software and Data Integrity Failures
  remediation: Deserialize with a parameterless JavaScriptSerializer (or System.Text.Json) into a fixed model; never use a SimpleTypeResolver on untrusted JSON.
  secure_code: |
    var data = new JavaScriptSerializer().Deserialize<Dto>(json);
  technical_impact: The __type field selects an arbitrary attacker-chosen CLR type, reaching deserialization gadgets and RCE.
  business_impact: Remote code execution via a malicious JSON body posted to the endpoint.

- id: csharp-deserialization-xmlserializer-dynamic-type
  category: vuln
  name: XmlSerializer with Attacker-Controlled Type
  description: XmlSerializer instantiated with a runtime type derived from Request input lets an attacker choose the deserialized CLR type.
  severity: high
  languages:
  - csharp
  keywords:
  - XmlSerializer
  - Type.GetType
  regex: new\s+XmlSerializer\([^)]*(?:Type\.GetType|Request)
  context_required:
  - Request
  - Type.GetType
  cwe: CWE-502
  owasp: A08:2021 Software and Data Integrity Failures
  remediation: Bind XmlSerializer to a single compile-time typeof(T); never resolve the target type from user input.
  secure_code: |
    var ser = new XmlSerializer(typeof(Invoice));
    var inv = (Invoice)ser.Deserialize(reader);
  technical_impact: Attacker selects an unexpected type whose setters/constructors reach dangerous behavior during deserialization.
  business_impact: Type-confusion leading to data tampering or a deserialization gadget path to code execution.

- id: csharp-xxe-xmldocument-load
  category: vuln
  name: .NET XXE via XmlDocument Load
  description: XmlDocument.Load/LoadXml (and XDocument.Load) on Request input resolve external entities on legacy frameworks.
  severity: high
  languages:
  - csharp
  keywords:
  - LoadXml
  - .Load(
  regex: \.LoadXml\([^)]*Request|\.Load\([^)]*Request
  context_required:
  - Request
  - Request.InputStream
  - Request.Form
  allowlist:
    regex:
    - XmlResolver\s*=\s*null
  cwe: CWE-611
  owasp: A05:2021 Security Misconfiguration
  remediation: Set XmlResolver = null on the XmlDocument before loading untrusted XML (default on .NET 4.5.2+, explicit on older).
  secure_code: |
    var doc = new XmlDocument { XmlResolver = null };
    doc.LoadXml(Request["xml"]);
  technical_impact: External entities read local files and reach internal URLs, exfiltrating data via in-band or OOB channels.
  business_impact: Disclosure of web.config secrets, SSRF into the cloud metadata service, and internal network access.

- id: csharp-xxe-legacy-xmltextreader
  category: vuln
  name: .NET XXE via Legacy XmlTextReader
  description: XmlTextReader (or ProhibitDtd set false) resolves DTDs and external entities by default on legacy frameworks.
  severity: high
  languages:
  - csharp
  keywords:
  - XmlTextReader
  - ProhibitDtd
  regex: new\s+XmlTextReader\s*\(|ProhibitDtd\s*=\s*false
  cwe: CWE-611
  owasp: A05:2021 Security Misconfiguration
  remediation: Use XmlReader.Create with a hardened XmlReaderSettings (DtdProcessing.Prohibit, XmlResolver null) instead of XmlTextReader.
  secure_code: |
    var settings = new XmlReaderSettings { DtdProcessing = DtdProcessing.Prohibit, XmlResolver = null };
    using var reader = XmlReader.Create(stream, settings);
  technical_impact: Inline and parameter entities read files and trigger OOB fetches during parsing.
  business_impact: Server file disclosure and SSRF pivoting into internal infrastructure.

- id: csharp-xxe-xmlresolver-external
  category: vuln
  name: .NET External XML Resolution Enabled
  description: Assigning XmlUrlResolver (or using an XIncludingReader) re-enables external entity and XInclude fetching.
  severity: high
  languages:
  - csharp
  keywords:
  - XmlUrlResolver
  - XIncludingReader
  regex: XmlResolver\s*=\s*new\s+XmlUrlResolver|new\s+XIncludingReader\s*\(
  cwe: CWE-611
  owasp: A05:2021 Security Misconfiguration
  remediation: Leave XmlResolver null; if resolution is required use a locked-down XmlSecureResolver, and do not enable XInclude on untrusted XML.
  secure_code: |
    var settings = new XmlReaderSettings { XmlResolver = null };
  technical_impact: The parser fetches attacker-referenced external DTDs and included documents, enabling XXE and SSRF.
  business_impact: File exfiltration and internal request forgery from any XML the resolver processes.

- id: csharp-xslt-script-enabled
  category: vuln
  name: XSLT Script Execution Enabled
  description: XsltSettings.TrustedXslt or EnableScript true lets an XSLT stylesheet run embedded C# code.
  severity: critical
  languages:
  - csharp
  keywords:
  - XsltSettings
  - TrustedXslt
  - EnableScript
  regex: XsltSettings\.TrustedXslt|new\s+XsltSettings\(\s*true\s*,\s*true\s*\)|\.EnableScript\s*=\s*true
  cwe: CWE-94
  owasp: A08:2021 Software and Data Integrity Failures
  remediation: Load stylesheets with XsltSettings.Default (script and document() disabled) and a null resolver; never trust user-supplied XSLT.
  secure_code: |
    var xslt = new XslCompiledTransform();
    xslt.Load(path, XsltSettings.Default, null);
  technical_impact: An attacker-controlled stylesheet with msxsl:script executes arbitrary .NET code in-process.
  business_impact: Remote code execution whenever untrusted XSLT can reach the transform.

- id: csharp-unsafe-reflection
  category: vuln
  name: .NET Unsafe Reflection from User Input
  description: Type.GetType or Activator.CreateInstance driven by Request input instantiates attacker-named types.
  severity: high
  languages:
  - csharp
  keywords:
  - Type.GetType
  - Activator.CreateInstance
  regex: Type\.GetType\([^)]*Request|Activator\.CreateInstance\([^)]*Request
  context_required:
  - Request
  - Request.QueryString
  - Request.Form
  - Request.Params
  cwe: CWE-470
  owasp: A03:2021 Injection
  remediation: Map user input to a fixed allowlist of permitted types instead of resolving type names dynamically.
  secure_code: |
    var handlers = new Dictionary<string, Func<IHandler>> { ["a"] = () => new AHandler() };
    var h = handlers[Request["kind"]]();
  technical_impact: Attacker loads and constructs unexpected types, reaching side-effecting constructors and gadget classes.
  business_impact: Logic subversion and a stepping stone to deserialization or code-execution chains.

- id: csharp-mass-assignment-tryupdatemodel
  category: vuln
  name: ASP.NET MVC Mass Assignment via TryUpdateModel
  description: TryUpdateModel/UpdateModel called with a bare model and no property allowlist lets attackers overpost fields.
  severity: high
  languages:
  - csharp
  keywords:
  - TryUpdateModel
  - UpdateModel
  regex: (?:TryUpdateModel|UpdateModel)(?:<[^>]+>)?\(\s*[A-Za-z_][A-Za-z0-9_.]*\s*\)
  cwe: CWE-915
  owasp: A08:2021 Software and Data Integrity Failures
  remediation: Pass an explicit includeProperties allowlist, or bind to a view model that omits sensitive fields.
  secure_code: |
    TryUpdateModel(user, "", new[] { "Name", "Email" });
  technical_impact: An attacker sets protected properties (IsAdmin, Balance) simply by adding them to the request body.
  business_impact: Privilege escalation and unauthorized modification of financial or role fields.

- id: csharp-redos-user-input
  category: vuln
  name: .NET Regular Expression DoS from User Input
  description: Building a Regex from user input (or matching with a user-supplied pattern) permits catastrophic backtracking DoS.
  severity: medium
  languages:
  - csharp
  keywords:
  - new Regex
  - Regex.Match
  - Regex.IsMatch
  regex: new\s+Regex\([^)]*Request|Regex\.(?:IsMatch|Match|Matches|Replace|Split)\([^)]*Request
  context_required:
  - Request
  - Request.QueryString
  - Request.Form
  - Request.Params
  cwe: CWE-1333
  owasp: A05:2021 Security Misconfiguration
  remediation: Do not compile attacker-supplied patterns; set a MatchTimeout on every Regex operating on user data.
  secure_code: |
    var re = new Regex(fixedPattern, RegexOptions.None, TimeSpan.FromMilliseconds(200));
  technical_impact: A malicious pattern or input triggers exponential backtracking, pinning a CPU core.
  business_impact: Denial of service exhausting worker threads and taking the application offline.

- id: xml-wcf-security-mode-none
  category: vuln
  name: WCF Binding Security Mode None
  description: A WCF binding with <security mode="None"> disables both transport and message protection.
  severity: high
  languages:
  - xml
  keywords:
  - <security
  - mode="None"
  regex: <security\s+mode\s*=\s*"None"
  cwe: CWE-319
  owasp: A02:2021 Cryptographic Failures
  remediation: Use security mode="Transport" or "Message" with an appropriate clientCredentialType for the binding.
  secure_code: |
    <security mode="Transport">
      <transport clientCredentialType="Certificate" />
    </security>
  technical_impact: Service traffic is unauthenticated and unencrypted, exposing it to interception and tampering.
  business_impact: Credential and data theft on the wire plus unauthenticated invocation of service operations.

- id: xml-wcf-client-credential-none
  category: vuln
  name: WCF clientCredentialType None
  description: clientCredentialType="None" on a WCF binding accepts callers without any authentication.
  severity: high
  languages:
  - xml
  keywords:
  - clientCredentialType="None"
  - clientCredentialType
  regex: clientCredentialType\s*=\s*"None"
  cwe: CWE-306
  owasp: A07:2021 Identification and Authentication Failures
  remediation: Require a real credential type (Windows, Certificate, or UserName over Transport) for every exposed binding.
  secure_code: |
    <transport clientCredentialType="Windows" />
  technical_impact: Any anonymous client can invoke the service contract, including privileged operations.
  business_impact: Unauthenticated access to backend business functions and data.

- id: xml-wcf-metadata-httpget
  category: vuln
  name: WCF Service Metadata Publishing Enabled
  description: <serviceMetadata httpGetEnabled="true"> exposes the WSDL/MEX contract to anonymous callers.
  severity: low
  languages:
  - xml
  keywords:
  - serviceMetadata
  - httpGetEnabled="true"
  regex: serviceMetadata[^>]*http[s]?GetEnabled\s*=\s*"true"
  cwe: CWE-651
  owasp: A05:2021 Security Misconfiguration
  remediation: Disable metadata publishing in production, or restrict the MEX endpoint to authenticated internal callers.
  secure_code: |
    <serviceMetadata httpGetEnabled="false" httpsGetEnabled="false" />
  technical_impact: The full operation and message contract is enumerable via ?wsdl, mapping every callable method.
  business_impact: Attack-surface disclosure that accelerates authorization and injection attacks on the service.

- id: xml-wcf-servicedebug-exception-detail
  category: vuln
  name: WCF includeExceptionDetailInFaults Enabled
  description: <serviceDebug includeExceptionDetailInFaults="true"> returns full server stack traces in SOAP faults.
  severity: medium
  languages:
  - xml
  keywords:
  - includeExceptionDetailInFaults="true"
  - includeExceptionDetailInFaults
  regex: includeExceptionDetailInFaults\s*=\s*"true"
  cwe: CWE-209
  owasp: A05:2021 Security Misconfiguration
  remediation: Set includeExceptionDetailInFaults="false" in production and return generic FaultException messages.
  secure_code: |
    <serviceDebug includeExceptionDetailInFaults="false" />
  technical_impact: SOAP faults carry internal type names, file paths, and exception chains to remote callers.
  business_impact: Sensitive implementation detail disclosure aiding follow-on exploitation.

- id: web-xss-response-write-request
  category: vuln
  name: WebForms Reflected XSS via Response.Write
  description: Response.Write emitting Request input without encoding produces reflected cross-site scripting.
  severity: high
  languages:
  - csharp
  keywords:
  - Response.Write
  - Request
  regex: Response\.Write\([^)]*Request
  context_required:
  - Request
  - Request.QueryString
  - Request.Form
  - Request.Params
  allowlist:
    regex:
    - HttpUtility\.HtmlEncode\(
    - Server\.HtmlEncode\(
  cwe: CWE-79
  owasp: A03:2021 Injection
  remediation: HTML-encode all user input before writing it, using HttpUtility.HtmlEncode or an auto-encoding control.
  secure_code: |
    Response.Write(HttpUtility.HtmlEncode(Request["q"]));
  technical_impact: Attacker-supplied markup is reflected into the page and executes in the victim browser.
  business_impact: Session hijacking, credential theft, and account takeover via XSS.

- id: web-xss-htmlstring-bypass
  category: vuln
  name: Razor Output Encoding Bypass via HtmlString
  description: new HtmlString or MvcHtmlString.Create wraps user input as pre-encoded, bypassing Razor auto-encoding.
  severity: high
  languages:
  - csharp
  - html
  keywords:
  - new HtmlString
  - MvcHtmlString.Create
  - HtmlString
  regex: new\s+HtmlString\([^)]*(?:Request|Model|ViewBag|ViewData|\+)|MvcHtmlString\.Create\([^)]*(?:Request|Model|ViewBag|ViewData|\+)
  context_required:
  - Request
  - Model
  - ViewBag
  - ViewData
  - +
  allowlist:
    regex:
    - HttpUtility\.HtmlEncode\(
    - AntiXss
  cwe: CWE-79
  owasp: A03:2021 Injection
  remediation: Render the value with plain @model so Razor encodes it; only wrap sanitized, trusted HTML.
  secure_code: |
    @Model.Bio
    @Html.Raw(_sanitizer.Sanitize(Model.Bio))
  technical_impact: The wrapped user string is emitted as raw HTML, executing injected scripts in the browser.
  business_impact: Stored or reflected XSS driving session theft and account compromise.

- id: java-xxe-xml-parser-parse
  category: vuln
  name: Java XXE via DOM/SAX Parser
  description: Request-derived XML parsed by DocumentBuilder/SAXParser/XMLReader/SAXReader without secure processing.
  severity: high
  languages:
  - java
  keywords:
  - DocumentBuilder
  - SAXParser
  - XMLReader
  - SAXReader
  - SAXBuilder
  - .parse(
  - .read(
  - .build(
  regex: (?:\.parse|\.read|\.build)\s*\(
  context_required:
  - getParameter
  - getInputStream
  - getReader
  - getPart
  - request
  - '@RequestBody'
  - '@RequestParam'
  allowlist:
    regex:
    - disallow-doctype-decl
    - FEATURE_SECURE_PROCESSING
    - setExpandEntityReferences\s*\(\s*false
  cwe: CWE-611
  owasp: A05:2021 Security Misconfiguration
  remediation: Call setFeature("http://apache.org/xml/features/disallow-doctype-decl", true) before parsing.
  secure_code: |
    DocumentBuilderFactory dbf = DocumentBuilderFactory.newInstance();
    dbf.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
  technical_impact: External-entity local file read, SSRF, and blind OOB exfiltration.
  business_impact: Disclosure of config secrets, cloud IAM credentials, and internal network reach.

- id: java-xxe-xmlinputfactory-create
  category: vuln
  name: Java XXE via XMLInputFactory (StAX)
  description: StAX reader created over request input without disabling IS_SUPPORTING_EXTERNAL_ENTITIES.
  severity: high
  languages:
  - java
  keywords:
  - XMLInputFactory
  - createXMLStreamReader
  - createXMLEventReader
  regex: createXML(?:Stream|Event)Reader\s*\(
  context_required:
  - getParameter
  - getInputStream
  - getReader
  - request
  - '@RequestBody'
  allowlist:
    regex:
    - IS_SUPPORTING_EXTERNAL_ENTITIES.{0,20}false
    - SUPPORT_DTD.{0,20}false
  cwe: CWE-611
  owasp: A05:2021 Security Misconfiguration
  remediation: Set IS_SUPPORTING_EXTERNAL_ENTITIES=false and SUPPORT_DTD=false on the factory.
  secure_code: |
    XMLInputFactory f = XMLInputFactory.newFactory();
    f.setProperty(XMLInputFactory.SUPPORT_DTD, false);
  technical_impact: External-entity file read and blind OOB exfiltration via StAX parsing.
  business_impact: Leakage of secrets and internal-service access from a single XML message.

- id: java-xxe-unmarshaller-unmarshal
  category: vuln
  name: Java XXE via JAXB Unmarshaller
  description: JAXB Unmarshaller.unmarshal on request XML without a hardened SAXSource.
  severity: high
  languages:
  - java
  keywords:
  - Unmarshaller
  - JAXB
  - .unmarshal(
  regex: \.unmarshal\s*\(
  context_required:
  - getParameter
  - getInputStream
  - getReader
  - request
  - '@RequestBody'
  - StreamSource
  allowlist:
    regex:
    - disallow-doctype-decl
    - setFeature
  cwe: CWE-611
  owasp: A05:2021 Security Misconfiguration
  remediation: Wrap the input in a SAXSource whose XMLReader has DOCTYPE declarations disallowed.
  secure_code: |
    spf.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
    Source src = new SAXSource(spf.newSAXParser().getXMLReader(), new InputSource(in));
  technical_impact: External-entity file read and SSRF while binding XML to Java objects.
  business_impact: Exposure of production secrets and internal endpoints via SSO/SOAP bodies.

- id: java-xxe-set-expand-entity-references
  category: vuln
  name: Java XXE Entity Expansion Explicitly Enabled
  description: setExpandEntityReferences(true) forces the parser to resolve external entities.
  severity: high
  languages:
  - java
  keywords:
  - setExpandEntityReferences
  regex: setExpandEntityReferences\s*\(\s*true\s*\)
  cwe: CWE-611
  owasp: A05:2021 Security Misconfiguration
  remediation: Remove the call or pass false, and disallow DOCTYPE declarations entirely.
  secure_code: |
    dbf.setExpandEntityReferences(false);
    dbf.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
  technical_impact: Guarantees external-entity resolution, enabling file read and SSRF.
  business_impact: Direct data-exfiltration path from any XML-consuming endpoint.

- id: java-path-traversal-new-file
  category: vuln
  name: Java Path Traversal via File Constructor
  description: Request input concatenated into new File/FileInputStream/FileReader path.
  severity: high
  languages:
  - java
  keywords:
  - new File(
  - new FileInputStream(
  - new FileReader(
  regex: new\s+(?:File|FileInputStream|FileReader)\s*\(
  context_required:
  - getParameter
  - getHeader
  - '@RequestParam'
  - '@PathVariable'
  - request.
  - +
  allowlist:
    regex:
    - getCanonicalPath
    - \.normalize\(\)
    - startsWith\(
  cwe: CWE-22
  owasp: A01:2021 Broken Access Control
  remediation: Resolve against a fixed base dir, canonicalize, and verify the result stays inside it.
  secure_code: |
    Path base = Paths.get("/srv/uploads").toRealPath();
    Path p = base.resolve(name).normalize();
    if (!p.startsWith(base)) throw new SecurityException();
  technical_impact: Arbitrary file read/write outside the intended directory (../../etc/passwd).
  business_impact: Disclosure of credentials/source and potential webshell write to RCE.

- id: java-path-traversal-paths-get
  category: vuln
