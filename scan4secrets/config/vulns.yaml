  technical_impact: Arbitrary method invocation and command execution via the expression engine.
  business_impact: RCE reaching environment variables, cloud metadata, and internal services.

- id: java-jndi-lookup-injection
  category: vuln
  name: Java JNDI Injection via Context.lookup
  description: Request-controlled name passed to InitialContext.lookup enabling remote class load (Log4Shell family).
  severity: critical
