  technical_impact: Injection into the local database, bypassing per-user row scoping.
  business_impact: Local privilege/data-isolation bypass exposing other users' records.

- id: kotlin-android-exported-intent-redirect
  category: vuln
  name: Android Intent Redirection via Untrusted Extra
  description: startActivity launches an Intent taken from an incoming getIntent extra (intent redirection).
  severity: medium
  languages:
  - kotlin
  keywords:
  - startActivity(
  regex: startActivity(?:ForResult)?\s*\(
  context_required:
  - getParcelableExtra
  - getStringExtra
  - Intent.parseUri
  - intent.extras
  - getIntent
  cwe: CWE-926
  owasp: A01:2021 Broken Access Control
  remediation: Never forward a nested Intent from an extra; validate target component/action against an allowlist.
  secure_code: |
