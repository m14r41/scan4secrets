  - '@RequestParam'
  - '@RequestBody'
  - request.
  cwe: CWE-917
  owasp: A03:2021 Injection
  remediation: Never look up attacker-controlled names; restrict to a static, validated set.
  secure_code: |
    if (!ALLOWED_JNDI.contains(name)) throw new SecurityException();
    ctx.lookup(name);
  technical_impact: Remote object/class load over LDAP/RMI leading to RCE on the JVM.
  business_impact: Full application-server takeover from an injected ${jndi:...} value.

- id: java-reflection-class-forname
  category: vuln
  name: Java Unsafe Reflection via Class.forName
