  technical_impact: Arbitrary Java execution via T(java.lang.Runtime).getRuntime().exec.
  business_impact: Full server compromise from a single request field (Struts/OGNL class).

- id: java-jexl-el-injection
  category: vuln
  name: Java Expression Injection (JEXL/EL)
  description: Request input compiled into a JEXL or Jakarta EL expression and evaluated.
  severity: critical
  languages:
