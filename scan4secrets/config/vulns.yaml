  technical_impact: Attacker app redirects the exported component to launch privileged internal activities.
  business_impact: Access-control bypass and abuse of the app's permissions by a malicious app.

- id: php-ssrf-request-input
  category: vuln
  name: PHP Server-Side Request Forgery
  description: Network client sink (curl/get_headers/fsockopen) fed a request superglobal.
  severity: high
  languages:
  - php
  keywords:
  - curl_init
  - curl_setopt
  - get_headers
  - fsockopen
  - stream_socket_client
  regex: (?:curl_init|get_headers|fsockopen|pfsockopen|stream_socket_client)\s*\(|curl_setopt\s*\([^)]*CURLOPT_URL
  context_required:
  - $_GET
  - $_POST
  - $_REQUEST
  - $_COOKIE
  - $_SERVER
  allowlist:
    regex:
    - FILTER_VALIDATE_URL
    - in_array
  cwe: CWE-918
  owasp: A10:2021 Server-Side Request Forgery
  remediation: Allowlist scheme and host; block internal/link-local and 169.254.169.254.
  secure_code: |
    $host = parse_url($_GET['url'], PHP_URL_HOST);
    if (!in_array($host, $ALLOWED, true)) { http_response_code(400); exit; }
  technical_impact: Reaches internal services and cloud metadata for credential theft.
  business_impact: Cloud account takeover via stolen instance credentials.

- id: php-path-traversal-fileread
  category: vuln
  name: PHP Path Traversal via File-Read Function
  description: readfile/file_get_contents/fopen given a request-controlled path.
  severity: high
  languages:
  - php
  keywords:
  - readfile
  - file_get_contents
  - fopen
  - fpassthru
  - highlight_file
  regex: (?:readfile|file_get_contents|fopen|fpassthru|show_source|highlight_file|file)\s*\(
  context_required:
  - $_GET
  - $_POST
  - $_REQUEST
  - $_COOKIE
  - ..
  allowlist:
    regex:
    - basename\(
    - realpath\(
    - str_replace
  cwe: CWE-22
  owasp: A01:2021 Broken Access Control
  remediation: Resolve with realpath and confirm the result stays under an allowed base dir.
  secure_code: |
    $real = realpath($base . '/' . basename($_GET['file']));
    if ($real === false || strpos($real, $base) !== 0) { http_response_code(403); exit; }
  technical_impact: Reads /etc/passwd, .env, and application config off the server.
  business_impact: Disclosure of secrets and source enabling deeper compromise.

- id: php-type-juggling-loose-compare
  category: vuln
  name: PHP Type Juggling on Secret Comparison
  description: Loose == / != on hashes, strcmp results, or secret fields (magic-hash bypass).
  severity: high
  languages:
  - php
  keywords:
  - strcmp
  - md5
  - sha1
  - ==
  - in_array
  regex: (?:strcmp|strcasecmp|md5|sha1|crc32|hash|password_hash|hash_hmac)\s*\([^)]*\)\s*(?:==|!=)(?!=)|(?:==|!=)(?!=)\s*(?:md5|sha1|crc32|hash)\s*\(|\$_(?:GET|POST|REQUEST|COOKIE)\[[^\]]*(?:pass|token|hash|otp|sig|secret|key)[^\]]*\]\s*(?:==|!=)(?!=)
  allowlist:
    regex:
    - hash_equals
    - ===
    - password_verify
  cwe: CWE-697
  owasp: A07:2021 Identification and Authentication Failures
  remediation: Use hash_equals()/password_verify() and strict === comparisons only.
  secure_code: |
    if (hash_equals($stored, hash_hmac('sha256', $_POST['token'], $key))) { /* ok */ }
  technical_impact: Auth or signature bypass when 0e-prefixed hashes compare equal.
  business_impact: Account takeover and forged-token acceptance.

- id: php-preg-replace-eval-modifier
  category: vuln
  name: PHP preg_replace /e Code Execution
  description: preg_replace pattern carries the /e modifier, evaluating the replacement as PHP.
  severity: critical
  languages:
  - php
  keywords:
  - preg_replace
  regex: preg_replace\s*\(\s*["\x27][^"\x27\n]*/[a-zA-Z]*e[a-zA-Z]*["\x27]
  allowlist:
    regex:
    - preg_replace_callback
  cwe: CWE-95
  owasp: A03:2021 Injection
  remediation: Remove the /e modifier; use preg_replace_callback with an explicit function.
  secure_code: |
    preg_replace_callback('/(\w+)/', fn($m) => strtoupper($m[1]), $input);
  technical_impact: Arbitrary PHP execution via the replacement expression.
  business_impact: Full server compromise and remote code execution.

- id: php-extract-variable-overwrite
  category: vuln
  name: PHP extract() Variable Overwrite
  description: extract() applied to a request superglobal overwrites arbitrary local variables.
  severity: high
  languages:
  - php
  keywords:
  - extract(
  regex: extract\s*\(\s*\$_(?:GET|POST|REQUEST|COOKIE|SERVER)
  allowlist:
    regex:
    - EXTR_SKIP
    - EXTR_PREFIX_ALL
  cwe: CWE-621
  owasp: A03:2021 Injection
  remediation: Never extract() untrusted input; read named keys explicitly.
  secure_code: |
    $name = $_POST['name'] ?? '';
  technical_impact: Overwrites $authenticated/$is_admin style flags to bypass logic.
  business_impact: Privilege escalation and authentication bypass.

- id: php-mail-header-injection
  category: vuln
  name: PHP mail() Header / Parameter Injection
  description: Request input flows into mail() headers or the additional_parameters argument.
  severity: high
  languages:
  - php
  keywords:
  - mail(
  regex: mail\s*\([^;]*\$_(?:GET|POST|REQUEST|COOKIE)
  context_required:
  - $_GET
  - $_POST
  - $_REQUEST
  - $_COOKIE
  allowlist:
    regex:
    - FILTER_VALIDATE_EMAIL
    - escapeshellarg
  cwe: CWE-93
  owasp: A03:2021 Injection
  remediation: Validate the address, strip CR/LF from headers, and escapeshellarg the 5th arg.
  secure_code: |
    $to = filter_var($_POST['email'], FILTER_VALIDATE_EMAIL);
    if ($to) { mail($to, $subject, $body); }
  technical_impact: Injects extra recipients/headers or sendmail -X args (log poisoning to RCE).
  business_impact: Mail relay abuse, spoofed mail, and potential server compromise.

- id: php-phar-deserialization
  category: vuln
  name: PHP Phar Deserialization
  description: phar:// stream or Phar object triggers unserialize of attacker metadata.
  severity: high
  languages:
  - php
  keywords:
  - phar://
  - PharData
  - new Phar
  - 'Phar::'
  regex: phar://|new\s+Phar(?:Data)?\s*\(|Phar::(?:mount|loadPhar|mapPhar)
  cwe: CWE-502
  owasp: A08:2021 Software and Data Integrity Failures
  remediation: Never pass user paths to filesystem funcs as phar://; validate upload contents.
  secure_code: |
    $data = json_decode(file_get_contents($safePath), true);
  technical_impact: Object-injection gadget chains from crafted Phar metadata reach RCE.
  business_impact: Remote code execution from an uploaded archive.

- id: php-rfi-allow-url-include
  category: vuln
  name: PHP Remote File Inclusion
  description: allow_url_include enabled or include/require of an http:// URL.
  severity: critical
  languages:
  - php
  keywords:
  - allow_url_include
  - include
  - require
  regex: allow_url_include["\x27]?\s*(?:,|=>|=)\s*["\x27]?(?:1\b|[Oo][Nn]\b|[Tt]rue\b)|(?:include|require)(?:_once)?\s*\(\s*[`"\x27]https?://
  cwe: CWE-98
  owasp: A03:2021 Injection
  remediation: Keep allow_url_include Off; include only local allowlisted paths.
  secure_code: |
    $page = basename($_GET['page']);
    include __DIR__ . '/pages/' . $page . '.php';
  technical_impact: Loads and executes attacker-hosted PHP from a remote URL.
  business_impact: Immediate remote code execution and full server takeover.

- id: php-assert-injection
  category: vuln
  name: PHP assert() Code Injection
  description: Request input passed to assert(), which evaluates a string as PHP (pre-8).
  severity: critical
  languages:
  - php
  keywords:
  - assert(
  regex: assert\s*\([^)]*\$_(?:GET|POST|REQUEST|COOKIE|SERVER)
  cwe: CWE-95
  owasp: A03:2021 Injection
  remediation: Never pass input to assert(); use explicit boolean checks.
  secure_code: |
    $ok = in_array($_GET['mode'], ['a', 'b'], true);
  technical_impact: Arbitrary PHP execution through the asserted expression string.
  business_impact: Remote code execution and full server compromise.

- id: php-weak-password-hash
  category: vuln
  name: PHP Weak Password Hashing
  description: Password field hashed with md5/sha1 instead of a password KDF.
  severity: medium
  languages:
  - php
  keywords:
  - md5
  - sha1
  - password
  regex: (?:md5|sha1)\s*\(\s*\$_(?:GET|POST|REQUEST|COOKIE)\[\s*["\x27]?[^\]]*(?:pass|pwd|secret|token)[^\]]*["\x27]?\s*\]|\$(?:password|passwd|pwd|pass|user_pass)\s*=\s*(?:md5|sha1)\s*\(
  allowlist:
    regex:
    - password_hash
    - PASSWORD_
    - hash_hmac
  cwe: CWE-916
  owasp: A02:2021 Cryptographic Failures
  remediation: Hash passwords with password_hash() using bcrypt or Argon2id.
  secure_code: |
    $hash = password_hash($_POST['password'], PASSWORD_ARGON2ID);
  technical_impact: Fast, unsalted hashes are trivially cracked from a DB dump.
  business_impact: Mass credential compromise after any database leak.

- id: php-unrestricted-file-upload
  category: vuln
  name: PHP Unrestricted File Upload
  description: move_uploaded_file writes using the client-supplied filename without extension control.
  severity: critical
  languages:
  - php
  keywords:
  - move_uploaded_file
  - $_FILES
  regex: move_uploaded_file\s*\([^,]*,\s*[^)]*\$_FILES\[[^\]]*\]\[\s*["\x27]?name["\x27]?
  allowlist:
    regex:
    - pathinfo\(
    - PATHINFO_EXTENSION
    - in_array
  cwe: CWE-434
  owasp: A04:2021 Insecure Design
  remediation: Generate a server-side name and allowlist the extension/MIME before saving.
  secure_code: |
    $ext = strtolower(pathinfo($_FILES['f']['name'], PATHINFO_EXTENSION));
    if (!in_array($ext, ['jpg','png'], true)) { exit; }
  technical_impact: Uploads a .php webshell into a web-served directory.
  business_impact: Remote code execution and full application takeover.

- id: php-parse-str-overwrite
  category: vuln
  name: PHP parse_str() Variable Overwrite
  description: Single-argument parse_str() injects request keys as local variables.
  severity: high
  languages:
  - php
  keywords:
  - parse_str
  regex: parse_str\s*\(\s*[^,()]+\)
  cwe: CWE-621
  owasp: A03:2021 Injection
  remediation: Always pass the second array argument to parse_str().
  secure_code: |
    parse_str($_SERVER['QUERY_STRING'], $params);
  technical_impact: Overwrites in-scope variables (auth flags, config) from the query string.
  business_impact: Privilege escalation and logic bypass.

- id: php-create-function-injection
  category: vuln
  name: PHP create_function Code Injection
  description: Request input passed to create_function(), which eval-compiles a function body.
  severity: critical
  languages:
  - php
  keywords:
  - create_function
  regex: create_function\s*\([^)]*\$_(?:GET|POST|REQUEST|COOKIE)
  cwe: CWE-94
  owasp: A03:2021 Injection
  remediation: Replace create_function with a real closure; never build it from input.
  secure_code: |
    $fn = function ($x) { return $x * 2; };
  technical_impact: Arbitrary PHP execution via the injected function body.
  business_impact: Remote code execution and full server compromise.

- id: php-sqli-procedural-2arg
  category: vuln
  name: PHP SQL Injection via Procedural 2-Arg Query
  description: Request superglobal concatenated into the query string that is the SECOND arg of mysqli_query/pg_query, or interpolated into $wpdb->query.
  severity: critical
  languages:
  - php
  keywords:
  - mysqli_query
  - pg_query
  - pg_send_query
  - $wpdb->
  - ->query(
  regex: (?:mysqli_query|mysqli_real_query|pg_query|pg_send_query)\s*\(\s*\$[A-Za-z_]\w*\s*,|\$wpdb->(?:query|get_results|get_var|get_row|get_col)\s*\(
  context_required:
  - $_GET
  - $_POST
  - $_REQUEST
  - $_COOKIE
  - $_SERVER
  allowlist:
    regex:
    - mysqli_prepare
    - ->prepare\(
    - \$wpdb->prepare
  cwe: CWE-89
  owasp: A03:2021 Injection
  remediation: Use mysqli_prepare / $wpdb->prepare with bound parameters, never concatenation.
  secure_code: |
    $stmt = mysqli_prepare($conn, 'SELECT * FROM t WHERE id = ?');
    mysqli_stmt_bind_param($stmt, 'i', $_GET['id']);
  technical_impact: Reads or modifies arbitrary rows and dumps credentials.
  business_impact: Full database breach across tenants.

- id: node-dynamic-require
  category: vuln
  name: Node Dynamic require() of Untrusted Module
  description: require() receives a non-literal, request-influenced module path.
  severity: high
  languages:
  - node
  keywords:
  - require(
  regex: require\s*\(\s*[^\s"\x27][^)]*\)
  context_required:
  - req.
  - request.
  - params
  - query
  - body
  - ${
  - '`'
  - +
  allowlist:
    regex:
    - require\(\s*[`"\x27]\.
    - ALLOWED
  cwe: CWE-98
  owasp: A03:2021 Injection
  remediation: Map input through a fixed allowlist object; never require a computed path.
  secure_code: |
    const mod = ALLOWED[name];
    if (!mod) throw new Error('unknown module');
  technical_impact: Loads arbitrary local files or gadget modules as executable code.
  business_impact: Remote code execution from user-chosen module names.

- id: node-redos-dynamic-regexp
  category: vuln
  name: Node Regex Injection / ReDoS via new RegExp
  description: new RegExp() built from request input enables injection and catastrophic backtracking.
  severity: medium
  languages:
  - node
  keywords:
  - new RegExp
  - RegExp(
  regex: new\s+RegExp\s*\(
  context_required:
  - req.
  - request.
  - params
  - query
  - body
  - +
  - ${
  - '`'
  allowlist:
    regex:
    - escapeStringRegexp
    - escapeRegExp
    - lodash.escapeRegExp
  cwe: CWE-1333
  owasp: A03:2021 Injection
  remediation: Escape input before RegExp construction or use a fixed literal pattern.
  secure_code: |
    const re = new RegExp(escapeStringRegexp(userInput));
  technical_impact: A crafted pattern hangs the event loop (ReDoS) or alters matching logic.
  business_impact: Denial of service and filter/authorization bypass.

- id: node-yaml-load-unsafe
  category: vuln
  name: Node js-yaml load Without Safe Schema
  description: js-yaml load() called without an explicit JSON/CORE schema restriction.
  severity: high
  languages:
  - node
  keywords:
  - yaml.load
  - jsyaml.load
  - js-yaml
  regex: (?:yaml|jsyaml|jsYaml|YAML)\.load\s*\(|require\s*\(\s*["\x27]js-yaml["\x27]\s*\)\.load\s*\(
  allowlist:
    regex:
    - JSON_SCHEMA
    - CORE_SCHEMA
    - FAILSAFE_SCHEMA
    - safeLoad
  cwe: CWE-502
  owasp: A08:2021 Software and Data Integrity Failures
  remediation: Restrict to JSON_SCHEMA and never load YAML from untrusted sources with custom types.
  secure_code: |
    const doc = yaml.load(input, { schema: yaml.JSON_SCHEMA });
  technical_impact: Custom-type YAML instantiates unexpected objects during parsing.
  business_impact: Data-integrity compromise and potential code execution.

- id: node-nosql-where-operator
  category: vuln
  name: Node NoSQL Injection via $where / $regex
  description: Mongo $where or $regex operator populated directly from request input.
  severity: high
  languages:
  - node
  keywords:
  - $where
  - $regex
  regex: '\$where\s*[:=]|["\x27]\$where["\x27]\s*:|\$regex\s*[:=]|["\x27]\$regex["\x27]\s*:'
  context_required:
  - req.
  - request.
  - params
  - query
  - body
  allowlist:
    regex:
    - String\(
    - sanitize
    - mongoSanitize
  cwe: CWE-943
  owasp: A03:2021 Injection
  remediation: Cast to String, drop $-prefixed keys, and avoid $where entirely.
  secure_code: |
    const user = await User.findOne({ name: String(req.body.name) });
  technical_impact: $where runs attacker JavaScript in the DB; $regex enables blind extraction.
  business_impact: Full collection disclosure and auth bypass.

- id: node-shelljs-execa-template
  category: vuln
  name: Node Command Injection via shelljs / execa Template
  description: shelljs.exec or execa command built from a template literal with interpolation.
  severity: critical
  languages:
  - node
  keywords:
  - shelljs
  - execa
  - .exec(
  - execaCommand
  regex: (?:shelljs|shell)\.exec\s*\(\s*`|execa(?:Command|Sync|\.(?:command|sync|commandSync))?\s*\(\s*`
  context_required:
  - ${
  - '`'
  - req.
  - params
  - query
  - body
  allowlist:
    regex:
    - execFile
    - execa\(\s*[`"\x27][^`"\x27]+[`"\x27]\s*,\s*\[
  cwe: CWE-78
  owasp: A03:2021 Injection
  remediation: Use the array form (execFile / execa(cmd, [args])); never interpolate into a shell string.
  secure_code: |
    execFileSync('convert', [input, output]);
  technical_impact: Shell metacharacters in input run arbitrary OS commands.
  business_impact: Remote code execution and host compromise.

- id: node-vm2-usage
  category: vuln
  name: Node vm2 Sandbox Usage
  description: Deprecated vm2 sandbox in use; multiple unpatched sandbox-escape CVEs.
  severity: high
  languages:
  - node
  keywords:
  - vm2
  - NodeVM
  - new VM
  regex: require\s*\(\s*["\x27]vm2["\x27]|from\s+["\x27]vm2["\x27]|new\s+(?:VM|NodeVM)\s*\(
  cwe: CWE-94
  owasp: A03:2021 Injection
  remediation: Drop vm2 (unmaintained); use isolated-vm or an out-of-process sandbox with limits.
  secure_code: |
    const result = await runInIsolate(expr, { timeout: 50 });
  technical_impact: Known escapes let sandboxed code reach the host and execute commands.
  business_impact: Remote code execution on any input evaluated in the sandbox.

- id: node-ssti-res-render
  category: vuln
  name: Node SSTI via res.render Dynamic Template
  description: res.render receives a request-controlled template name or inline source.
  severity: high
  languages:
  - node
  keywords:
  - res.render
  regex: res\.render\s*\(\s*[^"\x27\s)][^,)]*
  context_required:
  - req.
  - request.
  - params
  - query
  - body
  - ${
  - '`'
  cwe: CWE-1336
  owasp: A03:2021 Injection
  remediation: Pass a fixed template name; supply user data only through the locals object.
  secure_code: |
    res.render('profile', { name: req.query.name });
  technical_impact: A user-chosen template compiles to server-side code execution.
  business_impact: Remote code execution via the templating engine.

- id: node-csp-helmet-disabled
  category: vuln
  name: Node Content-Security-Policy Disabled
  description: Helmet configured with contentSecurityPolicy set to false.
  severity: medium
  languages:
  - node
  keywords:
  - contentSecurityPolicy
  regex: contentSecurityPolicy\s*:\s*false
  cwe: CWE-693
  owasp: A05:2021 Security Misconfiguration
  remediation: Keep CSP enabled with an explicit directive allowlist.
  secure_code: |
    app.use(helmet({ contentSecurityPolicy: { directives: cspDirectives } }));
  technical_impact: Removes the browser defense that contains injected script.
  business_impact: XSS becomes far easier to weaponize into account takeover.

- id: node-xss-protection-header-off
  category: vuln
  name: Node X-XSS-Protection Explicitly Disabled
  description: Response sets X-XSS-Protection to 0, turning off the legacy XSS auditor.
  severity: low
  languages:
  - node
  keywords:
  - X-XSS-Protection
  regex: '["\x27]X-XSS-Protection["\x27]\s*,\s*["\x27]?0'
  cwe: CWE-693
  owasp: A05:2021 Security Misconfiguration
  remediation: Remove the disabling header and rely on a strong Content-Security-Policy.
  secure_code: |
    res.setHeader('Content-Security-Policy', "default-src 'self'");
  technical_impact: Disables a defense-in-depth control against reflected XSS.
  business_impact: Weakened protection increases XSS exploitability.

- id: react-token-in-localstorage
  category: vuln
  name: Auth Token Stored in localStorage / sessionStorage
  description: A token/jwt/secret is written to web storage readable by any script.
  severity: medium
  languages:
  - node
  - react
  keywords:
  - localStorage
  - sessionStorage
  - setItem
  regex: (?:localStorage|sessionStorage)\.setItem\s*\(\s*[`"\x27][^`"\x27]*(?:token|jwt|auth|secret|apikey|api_key|access|refresh|session|password)[^`"\x27]*[`"\x27]
  cwe: CWE-922
  owasp: A02:2021 Cryptographic Failures
  remediation: Store session tokens in HttpOnly, Secure, SameSite cookies, not web storage.
  secure_code: |
    // set by server: Set-Cookie: session=...; HttpOnly; Secure; SameSite=Strict
  technical_impact: Any XSS reads the token directly from storage.
  business_impact: Session theft and account takeover on a single script injection.

- id: react-target-blank-no-noopener
  category: vuln
  name: target=_blank Without rel=noopener
  description: A _blank link lacks rel=noopener, exposing window.opener to reverse tabnabbing.
  severity: low
  languages:
  - react
  - html
  keywords:
  - _blank
  regex: target\s*=\s*[{"\x27]?_blank
  allowlist:
    regex:
    - noopener
    - noreferrer
  cwe: CWE-1022
  owasp: A05:2021 Security Misconfiguration
  remediation: Add rel="noopener noreferrer" to every target=_blank link.
  secure_code: |
    <a href={url} target="_blank" rel="noopener noreferrer">link</a>
  technical_impact: The opened page can redirect the opener tab via window.opener.
  business_impact: Phishing / credential theft through tab hijacking.

- id: react-href-user-open-redirect
  category: vuln
  name: React href Bound to User Input (Client Open Redirect)
  description: An href JSX expression is set from props/state/query without same-origin validation.
  severity: medium
  languages:
  - react
  keywords:
  - href
  regex: href\s*=\s*\{\s*[^}]*(?:props\.|state\.|query|params|location\.(?:search|href|hash)|redirect|returnUrl|next|url)[^}]*\}
  allowlist:
    regex:
    - startsWith\(
    - new URL
    - sanitizeUrl
  cwe: CWE-601
  owasp: A01:2021 Broken Access Control
  remediation: Only allow relative paths or an allowlisted origin before assigning href.
  secure_code: |
    const safe = url.startsWith('/') ? url : '/';
    return <a href={safe}>continue</a>;
  technical_impact: Sends users to an attacker-chosen destination from a trusted link.
  business_impact: Phishing and OAuth-token theft via redirect abuse.

- id: xml-inline-doctype-system-entity
  category: vuln
  name: Inline DOCTYPE / External Entity Declaration
  description: A data/template file declares a DOCTYPE or ENTITY referencing a SYSTEM resource.
  severity: high
  languages:
  - xml
  - html
  keywords:
  - <!DOCTYPE
  - <!ENTITY
  - SYSTEM
  regex: <!DOCTYPE[^>]*\s(?:SYSTEM|PUBLIC)\b|<!ENTITY\s+\S+\s+SYSTEM\b|<!ENTITY\s+%\s+\S+\s+SYSTEM\b
  cwe: CWE-611
  owasp: A05:2021 Security Misconfiguration
  remediation: Remove inline DOCTYPEs and disable DTD/entity loading in the parser.
  secure_code: |
    <!-- no DOCTYPE; parser configured to reject DTDs -->
  technical_impact: External entities read local files and reach internal URLs (XXE).
  business_impact: Secret disclosure and SSRF into internal infrastructure.

- id: xml-xinclude-usage
  category: vuln
  name: XML XInclude Usage
  description: Document declares the XInclude namespace or an xi:include element.
  severity: medium
  languages:
  - xml
  keywords:
  - XInclude
  - xi:include
  regex: xmlns:xi\s*=\s*["\x27]http://www\.w3\.org/2001/XInclude["\x27]|<xi:include\b
  cwe: CWE-611
  owasp: A05:2021 Security Misconfiguration
  remediation: Disable XInclude processing unless the source is fully trusted.
  secure_code: |
    <!-- parse with XInclude disabled; do not use xi:include on untrusted input -->
  technical_impact: xi:include pulls in local files or remote URLs, mirroring XXE file read.
  business_impact: Local file disclosure and SSRF.

- id: xml-billion-laughs-entity
  category: vuln
  name: XML Entity Expansion (Billion Laughs)
  description: An entity value references other entities, enabling exponential expansion DoS.
  severity: medium
  languages:
  - xml
  keywords:
  - <!ENTITY
  regex: <!ENTITY\s+\S+\s+["\x27](?:[^"\x27]*&\S+;){2,}
  cwe: CWE-776
  owasp: A05:2021 Security Misconfiguration
  remediation: Disable DTDs / cap entity expansion in the XML parser.
  secure_code: |
    <!-- disable DTD processing; enforce an entity-expansion limit -->
  technical_impact: Nested entity expansion exhausts memory and CPU parsing the document.
  business_impact: Denial of service against any XML-ingesting endpoint.

- id: xml-xslt-dangerous-function
  category: vuln
  name: XSLT document() / php:function Extension
  description: Stylesheet uses the php:xsl namespace, php:function, or document() calls.
  severity: high
  languages:
  - xml
  keywords:
  - php:function
  - http://php.net/xsl
  - 'xsl:'
  - document(
  regex: xmlns:php\s*=\s*["\x27]http://php\.net/xsl["\x27]|php:function\s*\(|<xsl:[^>]*\bdocument\s*\(|select\s*=\s*["\x27][^"\x27]*document\s*\(
  cwe: CWE-94
  owasp: A03:2021 Injection
  remediation: Disable extension functions and network/document() access in the XSLT processor.
  secure_code: |
    <!-- load the stylesheet without php:function or document(); disable extensions -->
  technical_impact: php:function reaches native PHP (RCE); document() enables file read/SSRF.
  business_impact: Remote code execution and internal resource disclosure.
