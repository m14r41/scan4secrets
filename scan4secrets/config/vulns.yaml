# scan4secrets — SAST vulnerability / misconfiguration rules (category: vuln).
# Activated with --misconfig (adds to secret scan) or --misconfig-only.
#
# Extra schema fields beyond the secret rules:
#   category: vuln            required — routes the rule to the misconfig engine
#   name                      human vulnerability name (report "Vulnerability Name")
#   languages                 file-type gate ([] = all). e.g. [python], [node, react]
#   context_required          taint hints; >=1 must appear on the line (cuts FP on
#                             safe literal usage). Omit for inherently-dangerous sinks.
#   cwe / owasp               mappings for the report
#   remediation / secure_code / technical_impact / business_impact  report fields
#
# Detection is line-based sink+taint. The FIRST regex match on a line is the
# evidence; the full line is captured as vulnerable_code.

# ============================ Python ============================

- id: py-command-injection
  category: vuln
  name: OS Command Injection
  description: Shell command built from dynamic input via os.system/subprocess/os.popen
  severity: critical
  languages: [python]
  keywords: ["os.system", "subprocess", "os.popen", "commands.getoutput"]
  regex: '(?:os\.system|os\.popen|subprocess\.(?:call|run|Popen|check_output|check_call)|commands\.getoutput)\s*\('
  context_required: ["+", "%", ".format(", "f\"", "f'", "request.", "req.", "args", "argv", "input(", "params", "os.environ", "shell=True"]
  cwe: CWE-78
  owasp: "A03:2021 Injection"
  remediation: Never build a shell string from input. Pass an argument list and avoid shell=True.
  secure_code: |
    subprocess.run(["ping", "-c", "1", host], shell=False, check=True)
  technical_impact: Arbitrary command execution as the app user; full host compromise, lateral movement.
  business_impact: Complete server takeover, data theft, ransomware staging, regulatory breach.

- id: py-code-injection-eval
  category: vuln
  name: Code Injection (eval/exec)
  description: Dynamic code execution via eval/exec
  severity: high
  languages: [python]
  keywords: ["eval(", "exec("]
  regex: '(?<![\w.])(?:eval|exec)\s*\('
  context_required: ["+", "%", ".format(", "f\"", "f'", "request.", "req.", "args", "input(", "params"]
  allowlist:
    regex: ["ast\\.literal_eval", "\\.eval\\("]
  cwe: CWE-95
  owasp: "A03:2021 Injection"
  remediation: Do not eval input. Use ast.literal_eval for data, or an explicit dispatch table.
  secure_code: |
    import ast
    value = ast.literal_eval(user_supplied)   # data only, never code
  technical_impact: Arbitrary Python execution in-process.
  business_impact: Full application compromise and data exfiltration.

- id: py-sql-injection
  category: vuln
  name: SQL Injection
  description: SQL string built with %/format/f-string/concatenation instead of parameters
  severity: high
  languages: [python]
  keywords: ["execute(", "executemany(", "cursor", "raw(", "text("]
  regex: '(?:\.execute|\.executemany|\.raw|sqlalchemy\.text)\s*\(\s*(?:f?["'']).*(?:SELECT|INSERT|UPDATE|DELETE|WHERE|FROM)'
  context_required: ["+", "%", ".format(", "f\"", "f'", "{"]
  cwe: CWE-89
  owasp: "A03:2021 Injection"
  remediation: Use parameterized queries — pass values as the second argument, never interpolate.
  secure_code: |
    cursor.execute("SELECT * FROM users WHERE id = %s", (user_id,))
  technical_impact: Read/modify arbitrary DB rows, authentication bypass, possible RCE via stacked queries.
  business_impact: Mass data breach, account takeover, data integrity loss.

- id: py-deserialization
  category: vuln
  name: Insecure Deserialization
  description: Untrusted data deserialized via pickle/yaml.load/marshal
  severity: high
  languages: [python]
  keywords: ["pickle.load", "pickle.loads", "yaml.load", "marshal.load", "cPickle"]
  regex: '(?:pickle\.loads?|cPickle\.loads?|marshal\.loads?|yaml\.load)\s*\('
  allowlist:
    regex:
      - 'yaml\.load\([^)]*Loader\s*=\s*(?:yaml\.)?(?:Safe|CSafe|Base)Loader'
      - 'yaml\.safe_load'
  cwe: CWE-502
  owasp: "A08:2021 Software and Data Integrity Failures"
  remediation: Use yaml.safe_load; never unpickle untrusted data. Prefer JSON for data interchange.
  secure_code: |
    data = yaml.safe_load(stream)          # not yaml.load
    obj = json.loads(payload)              # not pickle.loads
  technical_impact: Remote code execution during object reconstruction.
  business_impact: Server compromise from any attacker-influenced serialized blob.

- id: py-ssrf
  category: vuln
  name: Server-Side Request Forgery (SSRF)
  description: Outbound HTTP request to a URL derived from user input
  severity: high
  languages: [python]
  keywords: ["requests.get", "requests.post", "requests.request", "urlopen", "httpx.", "aiohttp"]
  regex: '(?:requests\.(?:get|post|put|request|head)|urllib\.request\.urlopen|urlopen|httpx\.(?:get|post))\s*\('
  context_required: ["request.", "req.", "args", "params", "input(", "+", ".format(", "f\"", "f'"]
  cwe: CWE-918
  owasp: "A10:2021 Server-Side Request Forgery"
  remediation: Allowlist destination hosts/schemes; block link-local/metadata ranges (169.254.169.254).
  secure_code: |
    host = urlparse(url).hostname
    if host not in ALLOWED_HOSTS: abort(400)
  technical_impact: Access to internal services, cloud metadata credential theft.
  business_impact: Cloud account takeover via stolen instance credentials.

- id: py-path-traversal
  category: vuln
  name: Path Traversal
  description: File path built from request input without normalization
  severity: high
  languages: [python]
  keywords: ["open(", "send_file", "os.path.join", "Path("]
  regex: '(?:open|send_file|send_from_directory)\s*\('
  context_required: ["request.", "req.", "args", "params", "filename", "..", "+", ".format(", "f\"", "f'"]
  cwe: CWE-22
  owasp: "A01:2021 Broken Access Control"
  remediation: Resolve the real path and confirm it stays within an allowed base dir.
  secure_code: |
    base = Path("/srv/data").resolve()
    target = (base / name).resolve()
    if base not in target.parents: abort(403)
  technical_impact: Read/write arbitrary files (/etc/passwd, source, keys).
  business_impact: Source/secret disclosure, config tampering.

- id: py-weak-hash
  category: vuln
  name: Weak Cryptographic Hash
  description: MD5/SHA1 used for security-sensitive hashing
  severity: medium
  languages: [python]
  keywords: ["hashlib.md5", "hashlib.sha1", "md5(", "sha1("]
  regex: 'hashlib\.(?:md5|sha1)\s*\('
  allowlist:
    regex: ["usedforsecurity\\s*=\\s*False"]
  cwe: CWE-327
  owasp: "A02:2021 Cryptographic Failures"
  remediation: Use SHA-256+ for integrity; use bcrypt/scrypt/argon2 for passwords.
  secure_code: |
    hashlib.sha256(data).hexdigest()
    bcrypt.hashpw(pw, bcrypt.gensalt())    # passwords
  technical_impact: Collision/preimage attacks; fast password cracking.
  business_impact: Credential compromise, integrity bypass.

- id: py-insecure-tls
  category: vuln
  name: Disabled TLS Certificate Verification
  description: TLS verification turned off (verify=False / unverified context)
  severity: high
  languages: [python]
  keywords: ["verify=False", "_create_unverified_context", "CERT_NONE"]
  regex: '(?:verify\s*=\s*False|ssl\._create_unverified_context|ssl\.CERT_NONE)'
  cwe: CWE-295
  owasp: "A02:2021 Cryptographic Failures"
  remediation: Leave verification enabled; pin/verify against a trusted CA bundle.
  secure_code: |
    requests.get(url, verify=True)         # or verify="/path/ca-bundle.pem"
  technical_impact: Man-in-the-middle interception of "encrypted" traffic.
  business_impact: Credential/session theft over hostile networks.

- id: py-ssti
  category: vuln
  name: Server-Side Template Injection (SSTI)
  description: Template rendered from a string built with user input
  severity: high
  languages: [python]
  keywords: ["render_template_string", "Template(", "from_string"]
  regex: '(?:render_template_string|Template|env\.from_string)\s*\('
  context_required: ["+", "%", ".format(", "f\"", "f'", "request.", "req.", "args", "params"]
  cwe: CWE-1336
  owasp: "A03:2021 Injection"
  remediation: Render static template files and pass input as context variables only.
  secure_code: |
    render_template("hello.html", name=user_name)   # not string-built
  technical_impact: Template-engine sandbox escape to RCE.
  business_impact: Full server compromise.

- id: py-flask-debug
  category: vuln
  name: Debug Mode Enabled
  description: Flask/Django debug server enabled (Werkzeug console = RCE)
  severity: medium
  languages: [python]
  keywords: ["debug=True", "DEBUG = True", "DEBUG=True"]
  regex: '(?:app\.run\([^)]*debug\s*=\s*True|DEBUG\s*=\s*True)'
  cwe: CWE-489
  owasp: "A05:2021 Security Misconfiguration"
  remediation: Disable debug in production; drive it from an env var defaulting to False.
  secure_code: |
    app.run(debug=os.environ.get("FLASK_DEBUG") == "1")
  technical_impact: Interactive debugger allows arbitrary code execution and info disclosure.
  business_impact: Trivial production RCE and data exposure.

# ============================ Node / JavaScript ============================

- id: node-command-injection
  category: vuln
  name: OS Command Injection
  description: child_process shell exec built from dynamic input
  severity: critical
  languages: [node]
  keywords: ["exec(", "execSync(", "spawn(", "spawnSync(", "child_process"]
  regex: '(?:child_process\.)?(?:exec|execSync|spawn|spawnSync)\s*\('
  context_required: ["+", "`", "${", "req.", "request.", "params", "query", "body", "argv", "process.env"]
  cwe: CWE-78
  owasp: "A03:2021 Injection"
  remediation: Use execFile/spawn with an argument array and shell:false; never concatenate.
  secure_code: |
    execFile("ping", ["-c", "1", host], (e, out) => { ... })
  technical_impact: Arbitrary command execution on the server.
  business_impact: Full host takeover and data breach.

- id: node-code-injection-eval
  category: vuln
  name: Code Injection (eval / new Function)
  description: Dynamic JS execution via eval or the Function constructor
  severity: high
  languages: [node, react]
  keywords: ["eval(", "new Function", "setTimeout(", "setInterval("]
  regex: '(?:\beval\s*\(|new\s+Function\s*\(|set(?:Timeout|Interval)\s*\(\s*["''`][^"''`]*\+)'
  context_required: ["+", "`", "${", "req.", "request.", "params", "query", "body", "location", "input"]
  cwe: CWE-95
  owasp: "A03:2021 Injection"
  remediation: Remove eval/Function on dynamic strings; use JSON.parse or a dispatch map.
  secure_code: |
    const obj = JSON.parse(payload);       // not eval('(' + payload + ')')
  technical_impact: Arbitrary JavaScript execution.
  business_impact: Application compromise, client or server side.

- id: node-sql-injection
  category: vuln
  name: SQL Injection
  description: SQL built with string concatenation / template literals
  severity: high
  languages: [node]
  keywords: ["query(", "execute(", "knex.raw", "sequelize.query", ".raw("]
  regex: '(?:\.query|\.execute|\.raw|sequelize\.query)\s*\(\s*[`"''].*(?:SELECT|INSERT|UPDATE|DELETE|WHERE|FROM)'
  context_required: ["+", "${", "`"]
  cwe: CWE-89
  owasp: "A03:2021 Injection"
  remediation: Use parameterized queries / bound placeholders.
  secure_code: |
    db.query("SELECT * FROM users WHERE id = ?", [userId]);
  technical_impact: Full database read/write, auth bypass.
  business_impact: Mass data breach and account takeover.

- id: node-nosql-injection
  category: vuln
  name: NoSQL Injection
  description: Mongo query built from request objects or using $where with input
  severity: high
  languages: [node]
  keywords: ["$where", ".find(", ".findOne(", "$function"]
  regex: '(?:\$where|\$function)\s*:'
  context_required: ["req.", "request.", "params", "query", "body", "+", "${", "`"]
  cwe: CWE-943
  owasp: "A03:2021 Injection"
  remediation: Cast inputs to expected types; avoid $where/$function; validate with a schema.
  secure_code: |
    User.findOne({ username: String(req.body.username) });
  technical_impact: Authentication bypass and data extraction.
  business_impact: Account takeover, data breach.

- id: node-ssrf
  category: vuln
  name: Server-Side Request Forgery (SSRF)
  description: Outbound request to a URL from request input
  severity: high
  languages: [node]
  keywords: ["axios.", "fetch(", "http.get", "https.get", "request(", "got("]
  regex: '(?:axios\.(?:get|post|request)|fetch|https?\.get|got|request)\s*\('
  context_required: ["req.", "request.", "params", "query", "body", "+", "${", "`"]
  cwe: CWE-918
  owasp: "A10:2021 Server-Side Request Forgery"
  remediation: Allowlist hosts/schemes; block internal and metadata IP ranges.
  secure_code: |
    if (!ALLOWED.has(new URL(url).hostname)) return res.sendStatus(400);
  technical_impact: Internal service access, cloud metadata credential theft.
  business_impact: Cloud account compromise.

- id: node-path-traversal
  category: vuln
  name: Path Traversal
  description: Filesystem path from request input without containment check
  severity: high
  languages: [node]
  keywords: ["readFile", "writeFile", "createReadStream", "createWriteStream", "sendFile"]
  regex: '(?:fs\.)?(?:readFile|readFileSync|writeFile|writeFileSync|createReadStream|createWriteStream)\s*\(|res\.sendFile\s*\('
  context_required: ["req.", "request.", "params", "query", "body", "+", "${", "`", ".."]
  cwe: CWE-22
  owasp: "A01:2021 Broken Access Control"
  remediation: Resolve and confirm the path stays under an allowed base directory.
  secure_code: |
    const p = path.resolve(BASE, name);
    if (!p.startsWith(BASE + path.sep)) return res.sendStatus(403);
  technical_impact: Arbitrary file read/write.
  business_impact: Source/secret disclosure, tampering.

- id: node-insecure-tls
  category: vuln
  name: Disabled TLS Certificate Verification
  description: TLS verification disabled in Node HTTPS/agent
  severity: high
  languages: [node]
  keywords: ["rejectUnauthorized", "NODE_TLS_REJECT_UNAUTHORIZED"]
  regex: '(?:rejectUnauthorized\s*:\s*false|NODE_TLS_REJECT_UNAUTHORIZED\s*=\s*["'']?0)'
  cwe: CWE-295
  owasp: "A02:2021 Cryptographic Failures"
  remediation: Keep rejectUnauthorized true; supply a proper CA if using internal certs.
  secure_code: |
    https.request({ ...opts, rejectUnauthorized: true });
  technical_impact: MITM interception of TLS traffic.
  business_impact: Credential/session theft.

- id: node-weak-crypto
  category: vuln
  name: Weak Cryptographic Hash
  description: MD5/SHA1 used via crypto.createHash
  severity: medium
  languages: [node]
  keywords: ["createHash"]
  regex: 'createHash\s*\(\s*["''](?:md5|sha1)["'']'
  cwe: CWE-327
  owasp: "A02:2021 Cryptographic Failures"
  remediation: Use sha256+; use bcrypt/scrypt/argon2 for passwords.
  secure_code: |
    crypto.createHash("sha256").update(data).digest("hex");
  technical_impact: Collision attacks, fast password cracking.
  business_impact: Integrity bypass, credential compromise.

- id: node-open-redirect
  category: vuln
  name: Open Redirect
  description: Redirect target taken directly from request input
  severity: medium
  languages: [node, react]
  keywords: ["res.redirect", "location.href", "location.replace", "window.location", "res.location"]
  regex: '(?:res\.redirect|res\.location|window\.location(?:\.href|\.replace)?|location\.href)\s*(?:\(|=)'
  context_required: ["req.", "request.", "params", "query", "body", "location.search", "+", "${", "`"]
  cwe: CWE-601
  owasp: "A01:2021 Broken Access Control"
  remediation: Allowlist redirect targets or restrict to same-origin relative paths.
  secure_code: |
    const dest = SAFE_PATHS.has(req.query.next) ? req.query.next : "/";
    res.redirect(dest);
  technical_impact: Phishing and OAuth token theft via attacker-controlled redirect.
  business_impact: Credential/token theft, brand abuse.

# ============================ React / DOM ============================

- id: react-dangerous-innerhtml
  category: vuln
  name: Cross-Site Scripting (dangerouslySetInnerHTML)
  description: Raw HTML injected into the DOM via dangerouslySetInnerHTML
  severity: high
  languages: [react]
  keywords: ["dangerouslySetInnerHTML"]
  regex: 'dangerouslySetInnerHTML\s*=\s*\{\{'
  allowlist:
    regex: ["DOMPurify\\.sanitize", "sanitize(Html|)\\("]
  cwe: CWE-79
  owasp: "A03:2021 Injection"
  remediation: Render as text, or sanitize with DOMPurify before injecting.
  secure_code: |
    <div dangerouslySetInnerHTML={{ __html: DOMPurify.sanitize(html) }} />
  technical_impact: Script execution in the victim's session (XSS).
  business_impact: Account takeover, session theft, defacement.

- id: dom-xss-sink
  category: vuln
  name: DOM-based XSS
  description: Untrusted value written to a DOM HTML sink
  severity: high
  languages: [node, react, html]
  keywords: ["innerHTML", "outerHTML", "document.write", "insertAdjacentHTML"]
  regex: '(?:\.innerHTML|\.outerHTML|document\.write|insertAdjacentHTML)\s*(?:=|\()'
  context_required: ["location", "req.", "query", "params", "input", "value", "+", "${", "`", "hash", "search"]
  allowlist:
    regex: ["DOMPurify\\.sanitize", "textContent"]
  cwe: CWE-79
  owasp: "A03:2021 Injection"
  remediation: Use textContent, or sanitize with DOMPurify before assigning HTML.
  secure_code: |
    el.textContent = userInput;            // not el.innerHTML = userInput
  technical_impact: Client-side script execution (XSS).
  business_impact: Session/account theft.

# ============================ SQL / PL/pgSQL ============================

- id: sql-dynamic-execute
  category: vuln
  name: SQL Injection (dynamic EXECUTE)
  description: Dynamic SQL string concatenated and run via EXECUTE/EXEC
  severity: high
  languages: [sql, psql]
  keywords: ["EXECUTE", "EXEC(", "sp_executesql"]
  regex: '(?i)(?:EXECUTE\s+IMMEDIATE|EXECUTE\s+|EXEC\s*\(|sp_executesql)'
  context_required: ["||", "+", "quote", "concat", "@", "'"]
  cwe: CWE-89
  owasp: "A03:2021 Injection"
  remediation: Use USING bind parameters (format %L / EXECUTE ... USING); never concatenate.
  secure_code: |
    EXECUTE 'SELECT * FROM t WHERE id = $1' USING v_id;
  technical_impact: Arbitrary query execution inside the database.
  business_impact: Mass data breach, integrity loss.

# ============================ General config / headers ============================

- id: cors-wildcard-origin
  category: vuln
  name: CORS Misconfiguration (wildcard origin)
  description: Access-Control-Allow-Origin set to * (or reflected) with credentials
  severity: medium
  languages: []
  keywords: ["Access-Control-Allow-Origin", "origin: true", "cors("]
  regex: '(?i)Access-Control-Allow-Origin["'']?\s*[:=]\s*["'']?\*'
  cwe: CWE-942
  owasp: "A05:2021 Security Misconfiguration"
  remediation: Reflect only vetted origins from an allowlist; never combine * with credentials.
  secure_code: |
    if (ALLOWED_ORIGINS.has(origin)) res.setHeader("Access-Control-Allow-Origin", origin);
  technical_impact: Cross-origin theft of authenticated responses.
  business_impact: Data leakage to malicious sites.

- id: insecure-cookie-flags
  category: vuln
  name: Insecure Cookie Configuration
  description: Session cookie set without HttpOnly/Secure flags
  severity: low
  languages: [node, python]
  keywords: ["httpOnly: false", "secure: false", "set_cookie", "res.cookie"]
  regex: '(?:httpOnly\s*:\s*false|secure\s*:\s*false)'
  cwe: CWE-1004
  owasp: "A05:2021 Security Misconfiguration"
  remediation: Set httpOnly, secure and sameSite on all session cookies.
  secure_code: |
    res.cookie("sid", v, { httpOnly: true, secure: true, sameSite: "strict" });
  technical_impact: Cookie theft via XSS or plaintext interception.
  business_impact: Session hijacking, account takeover.

# ============ Extended rules mined from bughunting/bughunting2 skills ============
- id: php-sqli-string-concat
  category: vuln
  name: PHP SQL Injection via String Concatenation
  description: Raw SQL query built with request superglobals passed to mysqli/mysql/pgsql query sink.
  severity: critical
  languages:
  - php
  keywords:
  - mysqli_query
  - mysql_query
  - pg_query
  - ->query(
  regex: (?:mysqli_query|mysql_query|pg_query|->query)\s*\(\s*["\x27]
  context_required:
  - $_GET
  - $_POST
  - $_REQUEST
  - $_COOKIE
  - $_SERVER
  cwe: CWE-89
  owasp: A03:2021 Injection
  remediation: Use parameterized queries with mysqli/PDO prepared statements and bound parameters.
  secure_code: |
    $stmt = $pdo->prepare('SELECT * FROM users WHERE name = ?');
    $stmt->execute([$_GET['name']]);
  technical_impact: Attacker reads or modifies arbitrary database rows and dumps schema/credentials.
  business_impact: Full customer PII/credential breach across a multi-tenant database.

- id: php-command-injection-shell
  category: vuln
  name: PHP OS Command Injection
  description: User superglobal reaches a shell-executing function (system/exec/shell_exec/popen/proc_open).
  severity: critical
  languages:
  - php
  keywords:
  - system(
  - exec(
  - shell_exec(
  - passthru(
  - popen(
  - proc_open(
  regex: (?:\bsystem|\bexec|\bshell_exec|\bpassthru|\bpopen|\bproc_open)\s*\(
  context_required:
  - $_GET
  - $_POST
  - $_REQUEST
  - $_COOKIE
  - $_SERVER
  - $_FILES
  allowlist:
    regex:
    - escapeshellarg
    - escapeshellcmd
  cwe: CWE-78
  owasp: A03:2021 Injection
  remediation: Avoid shells; use pcntl/proc_open with an argv array and escapeshellarg on every argument.
  secure_code: |
    $out = shell_exec('convert ' . escapeshellarg($_GET['file']) . ' out.png');
  technical_impact: Arbitrary OS command execution as the web-server user.
  business_impact: Full server compromise, source and secret exfiltration, lateral movement.

- id: php-code-injection-eval
  category: vuln
  name: PHP Code Injection via eval/assert
  description: Request superglobal flows into eval() or assert() executing attacker PHP.
  severity: critical
  languages:
  - php
  keywords:
  - eval(
  - assert(
  regex: (?:\beval|\bassert)\s*\(
  context_required:
  - $_GET
  - $_POST
  - $_REQUEST
  - $_COOKIE
  - $_SERVER
  cwe: CWE-95
  owasp: A03:2021 Injection
  remediation: Never eval user input; use a whitelist/dispatch map for dynamic behaviour.
  secure_code: |
    $allowed = ['sum' => fn($a,$b)=>$a+$b];
    ($allowed[$_GET['op']] ?? fn()=>null)();
  technical_impact: Arbitrary PHP execution in the application context.
  business_impact: Complete application and data compromise.

- id: php-deserialization-unserialize
  category: vuln
  name: PHP Object Injection via unserialize
  description: unserialize() on request superglobal enables __wakeup/__destruct gadget chains.
  severity: high
  languages:
  - php
  keywords:
  - unserialize(
  regex: \bunserialize\s*\(
  context_required:
  - $_GET
  - $_POST
  - $_REQUEST
  - $_COOKIE
  - $_SERVER
  allowlist:
    regex:
    - allowed_classes
  cwe: CWE-502
  owasp: A08:2021 Software and Data Integrity Failures
  remediation: Use json_decode for untrusted data, or pass allowed_classes=false to unserialize.
  secure_code: |
    $data = json_decode($_POST['data'], true);
  technical_impact: Object-injection gadget chains leading to file write, SQLi, or RCE (phpggc).
  business_impact: Server takeover via a serialized cookie or POST field.

- id: php-lfi-dynamic-include
  category: vuln
  name: PHP Local/Remote File Inclusion
  description: include/require path derived from a request superglobal enables LFI/RFI to RCE.
  severity: critical
  languages:
  - php
  keywords:
  - include
  - require
  - include_once
  - require_once
  regex: (?:\binclude|\brequire)(?:_once)?\s*[\(\s]
  context_required:
  - $_GET
  - $_POST
  - $_REQUEST
  - $_COOKIE
  - $_SERVER
  cwe: CWE-98
  owasp: A03:2021 Injection
  remediation: Map the parameter to a fixed whitelist of allowed files; never concatenate user input into a path.
  secure_code: |
    $pages = ['home'=>'home.php','about'=>'about.php'];
    include $pages[$_GET['p']] ?? 'home.php';
