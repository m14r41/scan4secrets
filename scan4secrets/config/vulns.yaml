  - concat
  allowlist:
    regex:
    - setXPathVariableResolver
    - XPathVariableResolver
  cwe: CWE-643
  owasp: A03:2021 Injection
  remediation: Bind values with an XPathVariableResolver instead of string concatenation.
  secure_code: |
